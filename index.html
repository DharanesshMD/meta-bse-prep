 reteach:{title:"Window errors vs everything else",body:"The window is about *time since the customer last wrote to you*, not about your account health.",code:"customer replies -> 24h free-form window opens\nwindow closes    -> 131047 on free-form\nfix              -> approved template\ncustomer replies -> window reopens"},
 retry:{q:"After sending the template, the customer replies. Can the partner now send free-form?",opts:["No, templates only forever","Yes — the customer's reply reopens a fresh 24-hour window","Only after 7 days","Only with approval"],ans:1,why:"Any inbound customer message restarts the window."}},
{id:"mt12",deck:"meta",type:"teach",title:"Template errors",body:"**132001** — template not approved, or doesn't exist in that language/locale\n**132000** — number of variables doesn't match the template\n**2388040** — a field exceeds the character limit"},
{id:"mt13",deck:"meta",type:"q",q:"Templates work in `en_US` but fail with 132001 in `pt_BR`. Most likely?",opts:["Rate limit","That template hasn't been created/approved in the pt_BR locale","Token expired","Payment issue"],ans:1,why:"Templates are approved per name *and* language. A missing locale is the classic cause.",
 reteach:{title:"Check three things on 132001",body:"1. Does the template name exist?\n2. Is it approved (not pending/rejected)?\n3. Does it exist in the exact locale being requested?",code:"name: order_update\n  en_US -> APPROVED\n  pt_BR -> missing   <- the bug"},
 retry:{q:"Error 132000 — variable count mismatch. Where do you look?",opts:["The access token","Compare the template's placeholder count in WhatsApp Manager against the parameters in the API request","The webhook URL","Billing"],ans:1,why:"Template body says 3 placeholders, request sends 2 — or the template was edited without updating the caller."}},

{id:"mt14",deck:"meta",type:"teach",title:"Rate limits — three different ones",body:"**4** — app-level API call rate limit\n**130429** — message throughput limit for that phone number\n**131056** — too many messages to the *same recipient* (pair rate limit)",note:"Different limits, different fixes. Naming the right one is the whole skill."},
{id:"mt15",deck:"meta",type:"q",q:"A partner blasts a campaign and hits **130429**. Best advice?",opts:["Retry immediately in a tight loop","Queue and throttle sends, back off exponentially, and improve quality rating to move up messaging tiers","Get a new token","Switch to Instagram"],ans:1,why:"Throughput limits are per phone number and tier-based. Retrying harder makes it worse.",
 reteach:{title:"Retry politely",body:"Exponential backoff + jitter, a send queue, and idempotency so retries don't duplicate messages.",code:"attempt 1 -> wait 1s\nattempt 2 -> wait 2s\nattempt 3 -> wait 4s   (+ random jitter)\ngive up   -> dead-letter queue + alert"},
 retry:{q:"Why add *jitter* to backoff?",opts:["It looks better in logs","Without it, every failed client retries at the same instant — a thundering herd that re-breaks the service","It's faster","It's required by the API"],ans:1,why:"Classic distributed-systems answer. Say 'thundering herd' in the interview."}},
{id:"mt16",deck:"meta",type:"q",q:"Error **131056** — many messages to one recipient. Fix?",opts:["Increase throughput tier","Per-recipient rate limiting: consolidate several messages into one, and space out sends to that number","New phone number","Use a template"],ans:1,why:"This is a per-pair limit, so raising overall throughput won't help.",
 reteach:{title:"Tell the limits apart",body:"• **4** → your app is calling the API too often overall\n• **130429** → this number is sending too many messages per second\n• **131056** → too many messages to *one* person",code:"Wrong diagnosis = wrong fix = repeat ticket."},
 retry:{q:"Which error means the *app's* management API calls are too frequent?",opts:["4","130429","131056","131047"],ans:0,why:"Error 4 is the app-level API call rate limit."}},

{id:"mt17",deck:"meta",type:"teach",title:"Auth errors",body:"**190 / 0** — access token expired or invalid\n**200 / 3 / 10** — missing permission scope\nScopes: `whatsapp_business_messaging`, `whatsapp_business_management`",note:"Fix: Access Token Debugger, then regenerate a system-user token with the right scopes."},
{id:"mt18",deck:"meta",type:"q",q:"All of one partner's calls started failing with 190 at 3am, no deploy. Likely?",opts:["Meta outage","Their access token expired — short-lived tokens lapse; a long-lived system-user token is the fix","Rate limit","Bad templates"],ans:1,why:"An abrupt, total, single-partner failure with an auth code points at token lifetime, not your service.",
 reteach:{title:"Read the shape of the outage",body:"• One partner + auth code → their credentials\n• All partners at once → your side (deploy, config, dependency)\n• Intermittent + 5xx → capacity or a flaky dependency",code:"190 -> token expired/revoked\n200 -> token lacks the scope"},
 retry:{q:"Partner regenerated the token and now gets 200 instead of 190. What changed?",opts:["Still expired","The token is valid but missing a required permission scope","Rate limited","Billing"],ans:1,why:"You moved from authentication to authorisation. Progress — now grant the scope."}},

{id:"mt19",deck:"meta",type:"teach",title:"Two places errors appear",body:"**Synchronous** — the API rejects your request, error in the HTTP response.\n**Asynchronous** — the request was accepted but delivery failed later, error arrives in a **status webhook**.",note:"This distinction is the single sharpest thing you can say in this interview."},
{id:"mt20",deck:"meta",type:"q",q:"\"The API returned 200 OK but the customer never got the message.\" Where do you look?",opts:["It's impossible","The message-status webhook — acceptance isn't delivery; the failure surfaces asynchronously in statuses[].errors[]","Retry the send","Check the token"],ans:1,why:"200 means 'queued', not 'delivered'. If the partner isn't consuming status webhooks, they're blind to every async failure.",
 reteach:{title:"The delivery lifecycle",body:"accepted → sent → delivered → read, and any step can fail *after* your 200.",code:"POST /messages -> 200 {id: wamid...}\nwebhook status: sent\nwebhook status: failed\n  errors[]: {code: 131048, ...}"},
 retry:{q:"A partner has no webhook endpoint configured at all. Consequence?",opts:["Nothing","They receive no inbound customer messages and no delivery/failure statuses — they're operating blind","Faster sends","Lower cost"],ans:1,why:"Webhooks are the entire inbound path. No endpoint = no visibility and no replies."}},
{id:"mt21",deck:"meta",type:"teach",title:"Quality rating",body:"**131048** — sending restricted because of negative user signals (blocks, reports).",note:"Fix is behavioural, not technical: pause broad campaigns, clean the list to explicit opt-ins, shift to transactional messages, let quality recover."},
{id:"mt22",deck:"meta",type:"teach",title:"Other codes worth knowing",body:"**131045** phone registration / certificate · **131042** payment method missing · **131050** user opted out of marketing · **368 / 130497** account restricted by policy · **131026** recipient's app too old"},

{id:"mt23",deck:"meta",type:"teach",title:"Your triage checklist",body:"1 Which direction — send or webhook?\n2 Sync error or async status error?\n3 One partner or all?\n4 Started when — did anything change?\n5 4xx (their request) or 5xx (our system)?\n6 Reproduce with a minimal request",note:"Recite this if you get a troubleshooting scenario. It's a complete answer on its own."},
{id:"mt24",deck:"meta",type:"q",q:"Scenario: one partner, 30% of sends fail, started after *their* deploy, mixed error codes. First hypothesis?",opts:["Meta outage","Something in their new release — a subset of requests is malformed or hitting a changed code path. Get failing payloads and diff against working ones","Global rate limit","Token expired"],ans:1,why:"Partial failure + correlated with their change + varied codes = a client-side regression on some code path.",
 reteach:{title:"Partial failures are a clue, not noise",body:"100% failure → credentials, config, connectivity.\nPartial failure → something about *those specific* requests. Find what the failing subset has in common: a locale, a template, a region, a payload field.",code:"Ask for: request ID, timestamp, full payload,\nfull error, and one WORKING example.\nThe diff is usually the answer."},
 retry:{q:"Fastest way to find what the failing subset shares?",opts:["Guess","Group the failures by error code, template, locale and region and look for the concentration","Restart everything","Wait"],ans:1,why:"That's literally a GROUP BY — the data round and the support job are the same skill."}},
{id:"mt25",deck:"meta",type:"teach",title:"Distributed systems talking points",body:"Retries + **idempotency** · exponential backoff + **jitter** · timeouts · **dead-letter queues** · at-least-once delivery means **duplicate webhooks** — consume idempotently · monitoring & alerting on error rate, not just uptime"},
{id:"mt26",deck:"meta",type:"q",q:"A partner processes the same inbound message twice. Cause and fix?",opts:["Meta bug","Webhooks are at-least-once — retries can redeliver. Deduplicate on the message ID","Rate limit","Bad token"],ans:1,why:"If their endpoint times out or 500s, Meta retries. Dedupe on the unique message id.",
 reteach:{title:"At-least-once delivery",body:"Nearly every webhook system guarantees at-least-once, not exactly-once. The consumer must be idempotent.",code:"if message_id in processed:  return 200\nprocess(msg)\nprocessed.add(message_id)\n# and ACK 200 FAST — do work async"},
 retry:{q:"A partner's webhook does 8 seconds of work before returning 200. Risk?",opts:["None","Timeouts cause redelivery and possible disabling of the webhook — ACK immediately, queue the work","Faster processing","Better ordering"],ans:1,why:"Acknowledge fast, process asynchronously. Standard webhook hygiene."}},
{id:"mt27",deck:"meta",type:"teach",title:"Questions to ask your interviewer",body:"• What do the top support escalations look like today?\n• How does the team feed partner pain back into the roadmap?\n• How do you measure whether Business Agent is answering well?\n• What's hardest about supporting agentic actions vs plain messaging?",note:"Specific questions like these land far better than \"what's the culture like?\""}
];

/* DECK 5 — BEHAVIOURAL, VALUES & MECHANICS */
const DECK_BE = [
{id:"be1",deck:"be",type:"teach",title:"STAR",body:"**S**ituation — context in one line\n**T**ask — what was yours to solve\n**A**ction — what *you* did (most of your airtime)\n**R**esult — the number, the outcome",note:"Aim for ~2 minutes. Most people over-tell S and under-tell A and R."},
{id:"be2",deck:"be",type:"q",q:"Which is the weakest STAR answer?",opts:["\"Our API error rate hit 8%. I owned triage, found a retry storm, added backoff and idempotency, and we dropped to 0.3% in a week.\"","\"I would look at the logs, form a hypothesis, and work with the team to fix it.\"","\"A partner's integration was failing. I reproduced it, found a locale mismatch, shipped a validation check, and escalations fell by half.\"","\"We missed an SLA. I rebuilt the on-call rota and MTTR went from 4h to 90m.\""],ans:1,why:"It's hypothetical. The guide is explicit: they want specific past examples, not theoretical responses.",
 reteach:{title:"Past tense, first person, with a number",body:"\"I would…\" is a red flag. \"I did… and the result was X%\" is the format.",code:"Weak : \"We usually handle it by...\"\nStrong: \"In March, I...  and it cut X by Y%.\""},
 retry:{q:"An answer says 'we' for every action. Problem?",opts:["None","The interviewer can't tell what YOU did — they're assessing your individual contribution","Too short","Too technical"],ans:1,why:"Set the team context, then switch to 'I' for your actions."}},
{id:"be3",deck:"be",type:"teach",title:"Prepare exactly 6 stories",body:"1 Hard technical debug\n2 Conflict or pushback\n3 Failure you owned\n4 Ambiguous problem, no clear owner\n5 Cross-functional / customer-facing win\n6 Something you improved that wasn't asked of you",note:"Six stories cover ~90% of behavioural questions. Write the R (the number) for each one today."},
{id:"be4",deck:"be",type:"q",q:"You don't have a metric for a story. Best move?",opts:["Invent a number","Use a real proxy: time saved, tickets avoided, escalations reduced, people unblocked — and say how you know","Skip the result","Say 'it went well'"],ans:1,why:"An honest qualitative result beats a fabricated number, and beats no result at all.",
 reteach:{title:"Results you can always reach for",body:"• Time: 'cut triage from 2 days to 3 hours'\n• Volume: 'repeat tickets dropped noticeably'\n• Scope: 'adopted by the other two teams'\n• Learning: 'we added it to the runbook'",code:"End every story with: \"...and the result was ___.\""},
 retry:{q:"Which result statement is strongest?",opts:["\"It worked out.\"","\"The fix removed a whole class of tickets — that error code stopped appearing in our weekly top 10.\"","\"Everyone was happy.\"","\"We shipped it.\""],ans:1,why:"Concrete and verifiable, even without a precise percentage."}},

{id:"be5",deck:"be",type:"teach",title:"Meta's values",body:"Move Fast · Focus on Long-Term Impact · Build Awesome Things · Live in the Future · Be Direct and Respect Your Colleagues · Meta, Metamates, Me",note:"Don't recite them. Pick one and let a story demonstrate it."},
{id:"be6",deck:"be",type:"q",q:"Which story best shows \"Be Direct and Respect Your Colleagues\"?",opts:["A time you worked late","A time you disagreed with a senior person, said so with data, and the decision improved — or you committed to theirs","A time you shipped fast","A time you learned a new tool"],ans:1,why:"Directness means raising the hard thing respectfully — and disagreeing-then-committing counts.",
 reteach:{title:"Value → story, not value → definition",body:"Never say \"I really align with Move Fast.\" Say \"we shipped a rough version in 3 days to learn, then hardened it.\" The value is implied.",code:"Move Fast          -> shipped small, learned, iterated\nLong-Term Impact   -> fixed the cause, not the symptom\nMetamates          -> unblocked someone else's project"},
 retry:{q:"Asked 'why Meta?', which answer is strongest?",opts:["\"It's a big company with good benefits.\"","Something specific: business messaging is where billions of people already talk to businesses, Business Agent is early, and support engineering sits right where partners hit real problems","\"I like AI.\"","\"Recruiters reached out.\""],ans:1,why:"Specific to *this* team and *this* product. Generic enthusiasm reads as no research."}},
{id:"be7",deck:"be",type:"teach",title:"\"Why this role?\" — your skeleton",body:"1 What draws me to business messaging + AI agents\n2 The specific overlap with my experience (APIs, debugging, distributed systems)\n3 What I want to build here",note:"Three beats, 45 seconds. Write yours out and say it aloud twice."},
{id:"be8",deck:"be",type:"teach",title:"The conflict story",body:"Show: you listened, you brought evidence, you separated the person from the position, and you named the outcome — including if you were wrong.",note:"\"I was wrong and changed my mind\" is a strength here, not a weakness."},
{id:"be9",deck:"be",type:"teach",title:"The failure story",body:"Real failure, your ownership, no blaming, and a concrete change you made afterwards.",note:"A failure story with no lasting change reads as unlearned. End on the systemic fix."},
{id:"be10",deck:"be",type:"q",q:"\"Tell me about a time you had no clear direction.\" What are they testing?",opts:["Technical depth","Whether you self-start: scope it yourself, state assumptions, pick a first step, and communicate as you go","How much you know about Meta","Your speed"],ans:1,why:"Ambiguity questions are about initiative and judgement — exactly what a partner-facing role needs.",
 reteach:{title:"The ambiguity template",body:"\"No one owned it → I wrote down what we knew and what we assumed → picked the smallest thing that would tell us the most → shared it early → adjusted.\"",code:"Show: bias to action + explicit assumptions\n      + early communication."},
 retry:{q:"Best first move on a vague request from a partner?",opts:["Build the biggest possible solution","Write down your understanding and assumptions and confirm them before building","Escalate immediately","Wait for clarity"],ans:1,why:"Same instinct they want in the coding round: clarify, state assumptions, then act."}},

{id:"be11",deck:"be",type:"teach",title:"Mechanics — don't lose points here",body:"Coderpad (code won't run) · Zoom screen share enabled **in advance** · no filters, no virtual/blurred backgrounds · headset recommended · no outside assistance or AI tools",note:"Test the screen share the day before. Setup can take a few minutes."},
{id:"be12",deck:"be",type:"q",q:"Which is explicitly not allowed?",opts:["Jeans","A blurred or virtual Zoom background","Asking the interviewer to repeat a question","Taking a moment to think"],ans:1,why:"The guide counts any visual effect on your video feed as a filter, including blurred backgrounds. Jeans are fine — it's a casual dress code.",
 reteach:{title:"The rules, plainly",body:"✓ casual clothes, ask for clarification, pause to think, take hints\n✗ filters/virtual backgrounds, notes read on camera, outside help or AI tools",code:"Turn OFF background blur before you join."},
 retry:{q:"Your code in coderpad won't execute. So you should…",opts:["Not worry about correctness","Dry-run a small example out loud at the end to catch your own bugs","Write pseudocode only","Skip edge cases"],ans:1,why:"You are the interpreter. Trace it manually — and say you're doing so."}},
{id:"be13",deck:"be",type:"teach",title:"When you don't know",body:"\"I'm not quite sure, but if I had to guess, I'd say…\" then reason out loud.",note:"Straight from the guide. It scores far better than a confident wrong answer or silence."},
{id:"be14",deck:"be",type:"teach",title:"Take the hint",body:"If the interviewer nudges you in a direction — go there immediately. The guide says: run with it.",note:"Ignoring a hint reads as not listening. Following one reads as coachable."},
{id:"be15",deck:"be",type:"teach",title:"Eye contact, no notes",body:"Treat it as in-person. Don't read from notes on camera.",note:"Which is exactly why you're drilling this into memory instead of writing a cheat sheet."},

{id:"be16",deck:"be",type:"teach",title:"The night before",body:"☐ Screen share tested, background blur OFF\n☐ 6 STAR stories, each with a result\n☐ \"Why Meta / why this role\" said aloud\n☐ 4 questions for the interviewer\n☐ Re-skim the SQL and debugging decks\n☐ Sleep"},
{id:"be17",deck:"be",type:"teach",title:"The first 60 seconds of each problem",body:"Restate it → ask one clarifying question → name your approach → then type.",note:"Every round. Coding, data, and AI. It's the same habit and it's the thing being scored."},
{id:"be18",deck:"be",type:"q",q:"Final check — the interviewer says \"looks good, anything else?\" after your query. Best response?",opts:["\"No, I'm done.\"","\"Two things I'd verify: NULL handling on that join column, and whether we want customers with zero orders included.\"","\"Should I rewrite it?\"","\"I think it's right.\""],ans:1,why:"Naming your own edge cases unprompted is the highest-signal thing you can do in the last 30 seconds of any round.",
 reteach:{title:"Always volunteer your edge cases",body:"NULLs · empty input · duplicates · ties · zero-count rows · very large input.\nPick the two that actually apply and say them.",code:"\"I'd also add a test for an empty list\nand for duplicate IDs.\""},
 retry:{q:"Why does self-critique score well?",opts:["It shows humility","It shows you can find bugs without being told — which is the entire job of a support engineer","It fills time","It's expected politeness"],ans:1,why:"They're hiring someone who catches problems before partners do."}},
{id:"be19",deck:"be",type:"teach",title:"You're done",body:"Swipe back through any deck marked red. Redo the ones you missed.",note:"Everything in here maps to something in the guide or to how this round is actually run. Go get it."}
];

/* PART 2 — DECK A: CODE IT OUT (live Python, type + explain) */
const DECK_P2CODE = [

{id:"c1",deck:"p2code",kind:"code",type:"open",
 q:"Given a list of log lines, return a dict of error code → count. Lines look like:\n`2026-08-12 ERROR 131047 template blocked`\nSome lines are INFO and have no code.",
 code:"logs = [\n  \"2026-08-12 ERROR 131047 window closed\",\n  \"2026-08-12 INFO  delivered ok\",\n  \"2026-08-12 ERROR 130429 throughput\",\n  \"2026-08-12 ERROR 131047 window closed\",\n]",
 clarify:["Are codes always the 3rd token? Could the format vary?","Should I count only ERROR lines, or WARN too?","What if a line is malformed — skip it or raise?"],
 model:"def count_errors(logs):\n    counts = {}\n    for line in logs:\n        parts = line.split()\n        if len(parts) < 3 or parts[1] != \"ERROR\":\n            continue                      # skip INFO / malformed\n        code = parts[2]\n        counts[code] = counts.get(code, 0) + 1\n    return counts\n\n# {'131047': 2, '130429': 1}",
 modelNote:"O(n) over the lines. The `len(parts) < 3` guard is the bit most candidates skip — mention it out loud even if you don't write it.",
 rubric:["Used a dict, not nested loops","Handled the non-ERROR lines without crashing","Stated O(n) unprompted","Mentioned Counter/defaultdict as the production version"],

{id:"c2",deck:"p2code",kind:"code",type:"open",
 q:"You have API call records. Return the partner with the highest **failure rate**, but only count partners with at least 10 calls.",
 code:"calls = [\n  {\"partner\": \"acme\", \"ok\": True},\n  {\"partner\": \"acme\", \"ok\": False},\n  {\"partner\": \"globex\", \"ok\": False},\n  # ... thousands more\n]",
 clarify:["Ties — return any, or all of them?","What if no partner has 10+ calls? Return None?","Is `ok` always present?"],
 model:"from collections import defaultdict\n\ndef worst_partner(calls, min_calls=10):\n    total = defaultdict(int)\n    fails = defaultdict(int)\n    for c in calls:\n        p = c[\"partner\"]\n        total[p] += 1\n        if not c.get(\"ok\", False):\n            fails[p] += 1\n\n    eligible = [\n        (fails[p] / total[p], p)\n        for p in total if total[p] >= min_calls\n    ]\n    if not eligible:\n        return None\n    return max(eligible)[1]",
 modelNote:"Two counters in one pass, then filter, then max. Note `fails[p] / total[p]` — true division, not `//`. And the empty-list guard.",
 rubric:["One pass to build counts, not one pass per partner","Applied the min_calls filter AFTER counting, not during","Float division (the // trap)","Handled the empty/None case"],
 followups:["Return the top 5 instead.","How would you do this in SQL?","What if calls arrive as a stream and you need a running answer?"]},

{id:"c3",deck:"p2code",kind:"code",type:"open",
 q:"Return the **second highest** salary in each department.\nIf a department has fewer than 2 distinct salaries, skip it.",

{id:"c4",deck:"p2code",kind:"code",type:"open",
 q:"Given a stream of webhook events, drop duplicates by `message_id`, keeping the one with the **latest** timestamp.",
 code:"events = [\n  {\"id\":\"m1\",\"ts\":5,\"status\":\"sent\"},\n  {\"id\":\"m1\",\"ts\":9,\"status\":\"delivered\"},\n  {\"id\":\"m2\",\"ts\":3,\"status\":\"sent\"},\n]",
 clarify:["If two events share an id AND a timestamp, which wins?","Do I need to preserve original order in the output?","Is the stream sorted by ts already?"],

 modelNote:"One pass, O(n), no sort needed. Sorting first would be O(n log n) — say that you considered and rejected it.",

{id:"c5",deck:"p2code",kind:"code",type:"open",
 q:"Write a function that returns True if a user has exceeded **N requests in the last W seconds**. You'll be called repeatedly as requests arrive.",
 code:"# limiter = RateLimiter(n=5, window=60)\n# limiter.allow(\"user1\", now=1000)  -> True/False",
 clarify:["Is `now` passed in, or do I call time.time()? (Passed in = testable)","Per-user or global?","Sliding window or fixed buckets? Sliding is stricter."],
 model:"from collections import defaultdict, deque\n\nclass RateLimiter:\n    def __init__(self, n, window):\n        self.n = n\n        self.window = window\n        self.hits = defaultdict(deque)\n\n    def allow(self, user, now):\n        q = self.hits[user]\n        # drop anything older than the window\n        while q and q[0] <= now - self.window:\n            q.popleft()\n        if len(q) >= self.n:\n            return False\n        q.append(now)\n        return True",
 modelNote:"A deque gives O(1) popleft. Amortised O(1) per call because each timestamp is added once and removed once.",
 rubric:["Chose deque and could say WHY (O(1) from both ends)","Evicted stale entries before checking the count","Passed `now` in rather than calling time.time() — testability","Noted the memory concern for many users"],
 followups:["Memory grows with users forever. Fix it.","How does this relate to WhatsApp error 131056?","Now make it distributed across 10 servers — what breaks?"]},

{id:"c7",deck:"p2code",kind:"code",type:"open",
 q:"Two config dicts. Return what **changed**: keys added, removed, and values that differ.",
 code:"old = {\"a\":1, \"b\":2, \"c\":3}\nnew = {\"a\":1, \"b\":99, \"d\":4}\n# added {d}, removed {c}, changed {b: (2,99)}",
 clarify:["Nested dicts, or flat only?","Should equal values be reported at all?","Order matter in the output?"],
 model:"def diff(old, new):\n    old_keys, new_keys = set(old), set(new)\n    return {\n        \"added\":   {k: new[k] for k in new_keys - old_keys},\n        \"removed\": {k: old[k] for k in old_keys - new_keys},\n        \"changed\": {k: (old[k], new[k])\n                    for k in old_keys & new_keys\n                    if old[k] != new[k]},\n    }",
 modelNote:"Set operations make this short and obviously correct. `-` for difference, `&` for intersection. This is a very common practical support-engineering task: 'what changed between the working config and the broken one?'",

{id:"c8",deck:"p2code",kind:"code",type:"open",
 q:"Find the first non-repeating character in a string. Return None if there isn't one.",
 code:"first_unique(\"aabbc\")  # 'c'\nfirst_unique(\"aabb\")   # None",
 clarify:["Case sensitive?","Whitespace counts as a character?","Unicode, or ASCII only?"],

{id:"c10",deck:"p2code",kind:"code",type:"open",
 q:"Write a retry wrapper: call a function, retry up to N times on exception, with **exponential backoff and jitter**.",
 code:"# result = retry(lambda: send_message(x), attempts=4)",
 clarify:["Retry on ALL exceptions, or only specific ones? (Important — don't retry a 400)","Should the final failure re-raise or return None?","Is a max total time needed?"],
 model:"import random, time\n\ndef retry(fn, attempts=4, base=1.0, retry_on=(TimeoutError, ConnectionError)):\n    last = None\n    for i in range(attempts):\n        try:\n            return fn()\n        except retry_on as e:\n            last = e\n            if i == attempts - 1:\n                break\n            delay = base * (2 ** i)\n            time.sleep(delay + random.uniform(0, delay * 0.1))  # jitter\n    raise last",
 modelNote:"This is THE question for this role. The three things that matter: only retry retryable errors, back off exponentially, add jitter to avoid a thundering herd.",
 rubric:["Did NOT retry on every exception — named which are retryable","Exponential, not fixed, delay","Added jitter and could explain thundering herd","Re-raised rather than silently returning None"],
 followups:["Why jitter? What's a thundering herd?","Which HTTP status codes would you retry? (429, 5xx — not 4xx)","Now add idempotency so a retry doesn't double-send."]},

{id:"c11",deck:"p2code",kind:"code",type:"open",
 q:"Validate an incoming API payload. Required fields: `to`, `type`, and if type is `template`, also `template.name` and `template.language`. Return a list of what's missing.",
 code:"payload = {\"to\":\"+91...\", \"type\":\"template\",\n           \"template\": {\"name\":\"order_update\"}}\n# -> [\"template.language\"]",
 clarify:["Should I validate types too, or just presence?","Is an empty string 'present'?","Return on first error, or collect all? (Collect all is better UX)"],
 model:"def validate(payload):\n    missing = []\n    for f in (\"to\", \"type\"):\n        if not payload.get(f):\n            missing.append(f)\n\n    if payload.get(\"type\") == \"template\":\n        tpl = payload.get(\"template\") or {}\n        for f in (\"name\", \"language\"):\n            if not tpl.get(f):\n                missing.append(f\"template.{f}\")\n    return missing",

{id:"c12",deck:"p2code",kind:"code",type:"open",
 q:"Given message events, compute the **delivery success rate per template**. An event is `{template, status}` where status is one of sent/delivered/failed.",
 code:"events = [\n  {\"template\":\"order_update\",\"status\":\"delivered\"},\n  {\"template\":\"order_update\",\"status\":\"failed\"},\n  {\"template\":\"promo\",\"status\":\"delivered\"},\n]",
 clarify:["Does 'sent' count as success or is only 'delivered' a success?","One event per message, or multiple status updates per message?","Round the rate, or return a float?"],
 model:"from collections import defaultdict\n\ndef success_rate(events, success={\"delivered\"}):\n    total = defaultdict(int)\n    good  = defaultdict(int)\n    for e in events:\n        total[e[\"template\"]] += 1\n        if e[\"status\"] in success:\n            good[e[\"template\"]] += 1\n    return {t: round(100 * good[t] / total[t], 1) for t in total}\n\n# {'order_update': 50.0, 'promo': 100.0}",
 modelNote:"The second clarifying question is the real trap: a single message emits sent THEN delivered, so naive counting double-counts. Raise it even if you then assume one event per message.",
 rubric:["Raised the multiple-statuses-per-message issue","Made the success set configurable rather than hardcoding a string","Float division","Would know how to do this in SQL too"],
 followups:["Write the SQL version.","Now break it down by locale as well.","Which templates should we alert on?"]},

{id:"c14",deck:"p2code",kind:"code",type:"open",
 q:"Return the K most frequent items in a list.",
 code:"top_k([\"a\",\"b\",\"a\",\"c\",\"a\",\"b\"], k=2)  # ['a','b']",
 clarify:["Ties — any order acceptable?","Is k ever bigger than the number of distinct items?","Do I return the items, or (item, count) pairs?"],
 model:"from collections import Counter\n\ndef top_k(items, k):\n    return [x for x, _ in Counter(items).most_common(k)]\n\n# By hand, if they ask you not to use Counter:\ndef top_k_manual(items, k):\n    counts = {}\n    for x in items:\n        counts[x] = counts.get(x, 0) + 1\n    return sorted(counts, key=counts.get, reverse=True)[:k]",
 modelNote:"Know both. Sorting is O(n log n); a heap gets you O(n log k), which matters when n is huge and k is small — say that even if you don't write it.",
 rubric:["Knew Counter.most_common","Could also write it by hand","Stated the complexity and mentioned heapq for large n","Handled k > distinct count gracefully"],
 followups:["Now do it in O(n log k) with a heap.","What if the data doesn't fit in memory?","SQL version?"]},

{id:"c15",deck:"p2code",kind:"code",type:"open",
 q:"Given request timestamps (seconds), find the **maximum number of requests in any 60-second window**.",
 code:"ts = [1, 5, 10, 62, 63, 64, 65]\n# -> 4  (62..65 plus 10? check your window definition)",
 clarify:["Is the window inclusive on both ends?","Is the input sorted?","Sliding window over actual timestamps, or fixed minute buckets?"],
 model:"def max_in_window(ts, window=60):\n    ts = sorted(ts)\n    best = left = 0\n    for right in range(len(ts)):\n        while ts[right] - ts[left] >= window:\n            left += 1\n        best = max(best, right - left + 1)\n    return best",
 modelNote:"Classic two-pointer sliding window. Each pointer only moves forward, so it's O(n) after the sort. Being able to say 'left never goes backwards, so it's linear' is the insight they want.",
 rubric:["Two pointers, not a nested loop","Explained why it's O(n) and not O(n²)","Pinned down the inclusive/exclusive boundary before coding","Connected it to rate limiting"],
 followups:["Why is this O(n) and not O(n²)?","Now return WHICH window it was.","How does this differ from fixed-bucket counting?"]},

{id:"c16",deck:"p2code",kind:"code",type:"open",

{id:"d0",deck:"p2debug",type:"teach",title:"The debug round",body:"They show you code or a scenario. They want to hear your **process**, not just the answer.",note:"Answer in this shape: what I observe → what I suspect → how I'd confirm → the fix → how I'd stop it recurring."},

{id:"d1",deck:"p2debug",kind:"code",type:"open",
 q:"A partner reports duplicate charges. Read this and explain, out loud, what's wrong and how you'd fix it.",
 code:"def process_refund(order_id, amount):\n    for attempt in range(3):\n        try:\n            resp = payments.refund(order_id, amount)\n            return resp\n        except Exception:\n            continue\n    raise RuntimeError(\"refund failed\")",
 clarify:["What does payments.refund do on a timeout — does it commit server-side?","Are we sure the exception means it failed?"],
 model:"# THE BUG: a timeout does not mean the refund didn't happen.\n# The call may have SUCCEEDED server-side and only the response was lost.\n# We then retry and refund again. Twice.\n\ndef process_refund(order_id, amount, idem_key):\n    for attempt in range(3):\n        try:\n            return payments.refund(order_id, amount,\n                                   idempotency_key=idem_key)\n        except (TimeoutError, ConnectionError):\n            time.sleep(2 ** attempt + random.random())\n        except ValueError:\n            raise            # 4xx: retrying will never help\n    raise RuntimeError(\"refund failed after retries\")",
 modelNote:"Three separate defects: (1) no idempotency key, so retries duplicate; (2) bare `except Exception` retries non-retryable errors; (3) no backoff.",
 rubric:["Identified that a timeout is ambiguous, not a failure","Named idempotency as the fix","Spotted the over-broad except","Spotted the missing backoff"],
 followups:["Where should the idempotency key come from?","Which errors should never be retried?","How would you detect this in production before a partner tells you?"]},

 model:"# THE BUG: zip stops at the SHORTER iterable. Silently.\n# report == {'acme': 10, 'globex': 20}\n# initech and umbrella are gone. No error. No warning.\n\n# Fix 1 — fail loudly:\nreport = dict(zip(names, counts, strict=True))   # Python 3.10+\n\n# Fix 2 — pad:\nfrom itertools import zip_longest\nreport = dict(zip_longest(names, counts, fillvalue=0))",
 modelNote:"`strict=True` is the right instinct for data pipelines: if the lengths disagree, that is itself a bug you want to know about, not paper over.",
 rubric:["Knew zip truncates silently","Preferred failing loudly over padding by default","Asked where the mismatch came from — root cause, not symptom","Knew strict=True or zip_longest"],
 followups:["Which fix would you actually ship, and why?","How would you catch this in a data pipeline?","What's the pandas equivalent of this bug?"]},

{id:"d5",deck:"p2debug",kind:"code",type:"open",
 q:"A config change in one tenant leaked into all tenants. Find it.",
 code:"DEFAULTS = {\"retries\": 3, \"timeout\": 30}\n\ndef get_config(overrides):\n    cfg = DEFAULTS\n    cfg.update(overrides)\n    return cfg",
 clarify:["Is DEFAULTS module-level and shared?","Is get_config called per request?"],
 model:"# THE BUG: cfg = DEFAULTS does not copy — it's the same object.\n# .update() mutates the shared global. Every later caller sees it.\n\ndef get_config(overrides):\n    cfg = {**DEFAULTS, **overrides}    # new dict every call\n    return cfg\n\n# For nested config you need a deep copy:\n# cfg = copy.deepcopy(DEFAULTS); cfg.update(overrides)",
 modelNote:"Same family as the mutable-default-argument bug: shared mutable state that looks local. Cross-tenant leakage makes it a security issue, not just a correctness one.",
 rubric:["Spotted assignment-is-not-a-copy","Used {**a, **b} or dict(DEFAULTS)","Raised deep vs shallow for nested config","Flagged the cross-tenant/security angle"],
 followups:["What if DEFAULTS has a nested dict inside?","How does this relate to mutable default arguments?","How would you prevent this class of bug structurally?"]},

{id:"d6",deck:"p2debug",kind:"code",type:"open",
 q:"This silently loses errors in production. What would you change?",
 code:"for row in rows:\n    try:\n        process(row)\n    except:\n        pass",
 clarify:["Is losing a row acceptable, or must every row succeed?","Is there any monitoring downstream?"],
 model:"failed = []\nfor i, row in enumerate(rows):\n    try:\n        process(row)\n    except (ValueError, KeyError) as e:\n        failed.append((i, row.get(\"id\"), str(e)))\n        logger.warning(\"row %s failed: %s\", i, e)\n\nif failed:\n    logger.error(\"%d/%d rows failed\", len(failed), len(rows))\n    metrics.increment(\"rows.failed\", len(failed))",
 modelNote:"Three problems with the original: bare `except` catches KeyboardInterrupt and SystemExit too; nothing is logged; and nothing is counted, so no alert ever fires. Skipping bad rows is often the right *behaviour* — doing it silently never is.",
 rubric:["Named specific exceptions instead of bare except","Logged with enough context to find the row later","Emitted a metric so it's alertable","Distinguished 'skip the row' (fine) from 'skip silently' (not fine)"],
 followups:["What's actually wrong with a bare `except:`?","When IS it right to swallow an exception?","How would you alert on this?"]},

{id:"d7",deck:"p2debug",kind:"code",type:"open",
 q:"A daily report misses records near midnight. Find the bug.",
 code:"WHERE created_at >= '2026-08-12'\n  AND created_at <= '2026-08-12'",
 clarify:["Is created_at a date or a timestamp?","What timezone is it stored in? What timezone does the partner mean?"],
 model:"-- BUG 1: created_at is a TIMESTAMP. '2026-08-12' means 00:00:00,\n-- so <= only matches exactly midnight. Everything after is lost.\n\nWHERE created_at >= '2026-08-12'\n  AND created_at <  '2026-08-13'     -- half-open range\n\n-- BUG 2 (the real one): whose midnight?\n-- Data stored UTC, partner in IST (+5:30) -> their day\n-- is 18:30 to 18:30 UTC, not 00:00 to 00:00.",
 modelNote:"The half-open range `>= start AND < next_start` is the pattern to memorise. The timezone question is the one that impresses — for a global partner-facing role it is a real, constant source of 'the numbers don't match' tickets.",
 rubric:["Half-open range, not BETWEEN on a timestamp","RAISED TIMEZONE unprompted — the differentiator","Explained why DATE(created_at) is also a bad fix","Connected it to 'partner says our numbers disagree'"],
 followups:["Partner in IST says our daily numbers are wrong. Walk me through it.","Why not just use DATE(created_at) = ...?","Where should the timezone conversion happen?"]},

{id:"d8",deck:"p2debug",kind:"code",type:"open",
 q:"This crashes on large files. Fix it.",
 code:"def count_errors(path):\n    lines = open(path).read().split(\"\\n\")\n    return sum(1 for l in lines if \"ERROR\" in l)",
 clarify:["How large do these files get?","Is this run on a memory-constrained box?"],

{id:"d9",deck:"p2debug",type:"open",kind:"speak",
 q:"**Scenario, no code.** A partner says: \"Your API is down. Nothing works.\" You have Slack open and nothing else.\n\nTalk me through your first five minutes.",
 clarify:["(This is the question. Don't ask for more — drive it yourself.)"],
 model:"1. SCOPE IT before touching anything.\n   \"Can you send me one failing request — timestamp, request ID,\n    the endpoint, and the exact error body you got back?\"\n   Also: is it 100% or intermittent? Started when?\n   One endpoint or all? Did anything change on your side?\n\n2. CHECK BLAST RADIUS.\n   Is it just them, or all partners? Our dashboards answer that\n   in seconds and it splits the problem completely in half.\n\n3. READ THE ERROR CLASS.\n   4xx -> their request. 5xx -> our system.\n   An auth code on one partner -> their token.\n   Everyone at once -> our deploy or a dependency.\n\n4. REPRODUCE minimally with their payload.\n\n5. COMMUNICATE while investigating: \"I can see your failures,\n   here's what I'm checking, I'll update you in 20 minutes.\"",
 modelNote:"Notice what is NOT in there: guessing. 'Down' is an adjective; you cannot debug an adjective. Every step narrows the space. And step 5 matters — a partner-facing role is judged on communication under pressure, not only on the fix.",
 rubric:["Asked for a concrete reproducible failure first","Established blast radius (one partner vs all)","Used 4xx/5xx to split client vs server","Committed to a communication cadence"],
 followups:["It's all partners, started 10 minutes ago. Now what?","It's only them, and only 30% of requests. Now what?","They're escalating to your VP. What do you send?"]},

{id:"d10",deck:"p2debug",type:"open",kind:"speak",
 q:"**Scenario.** Messages are being accepted — the API returns 200 — but customers never receive them.\n\nWhere do you look, and what's your hypothesis?",
 clarify:["(Drive it yourself.)"],
 model:"A 200 means ACCEPTED, not DELIVERED. Those are different\nsystems and they fail in different places.\n\nSo I'd look at the message-status webhook, not the send path.\nDelivery failures surface asynchronously in statuses[].errors[].\n\nMy first hypotheses, in order:\n  - The partner isn't consuming status webhooks at all, so they\n    are blind to failures that are already being reported.\n  - Quality-rating restriction (131048) silently limiting sends.\n  - 24-hour window expired (131047) on free-form messages.\n  - Their webhook endpoint is down or timing out, so they never\n    see the statuses even though we're sending them.\n\nFirst question to them: \"Are you receiving status webhooks,\nand what does statuses[].errors[] contain for one of these IDs?\"",
 modelNote:"The sync-vs-async distinction is the sharpest single thing you can say in this interview. Most candidates treat 200 as success. Saying 'accepted is not delivered' immediately reads as someone who has actually operated a messaging API.",
 rubric:["Separated acceptance from delivery","Went to the status webhook, not the send path","Named plausible specific causes","Asked a question that would actually resolve it"],
 followups:["What if they have no webhook configured at all?","How would you prove it's their endpoint and not ours?","How would you stop this being a repeat ticket?"]}
];

{id:"s0b",deck:"p2sql",type:"teach",title:"Your working schema",body:"These problems all use the same made-up support schema. Learn it once.",code:"partners(id, name, region, created_at)\ntickets(id, partner_id, status, error_code,\n        created_at, resolved_at)\nmessages(id, partner_id, template, locale,\n         status, sent_at)\n-- status: 'sent' | 'delivered' | 'failed'"},

{id:"s1",deck:"p2sql",kind:"sql",type:"open",
 q:"Top 5 error codes in the last 7 days, with counts, most common first.",
 clarify:["Is created_at a timestamp? Timezone?","Exclude NULL error codes?"],
 model:"SELECT error_code,\n       COUNT(*) AS n\nFROM tickets\nWHERE created_at >= CURRENT_DATE - INTERVAL '7 days'\n  AND error_code IS NOT NULL\nGROUP BY error_code\nORDER BY n DESC\nLIMIT 5;",
 modelNote:"The `IS NOT NULL` is the detail most people skip. Without it you get a NULL bucket that may well be your biggest 'code'.",
 rubric:["GROUP BY the code, ORDER BY the count DESC","Handled NULL error codes","Half-open / interval date filter","Aliased the count so ORDER BY is readable"],
 followups:["Now show week-over-week change per code.","Break it down by region too.","Which of these would you alert on?"]},

{id:"s2",deck:"p2sql",kind:"sql",type:"open",
 q:"Resolution rate per partner over the last 30 days. Only partners with at least 50 tickets. Worst performers first.",
 clarify:["Is 'resolved' a status value, or is resolved_at IS NOT NULL the truth?","Does the 50-ticket threshold apply before or after the date filter?"],
 model:"SELECT p.name,\n       COUNT(*) AS tickets,\n       ROUND(100.0 * SUM(CASE WHEN t.status = 'resolved'\n                              THEN 1 ELSE 0 END)\n             / COUNT(*), 1) AS resolve_pct\nFROM tickets t\nJOIN partners p ON p.id = t.partner_id\nWHERE t.created_at >= CURRENT_DATE - INTERVAL '30 days'\nGROUP BY p.name\nHAVING COUNT(*) >= 50\nORDER BY resolve_pct ASC;",
 modelNote:"`100.0` not `100` — integer division would give you a column of zeros. WHERE filters rows, HAVING filters groups; the threshold has to be HAVING because it's an aggregate.",
 rubric:["Conditional aggregation with CASE WHEN","100.0 to force float division","Threshold in HAVING, date in WHERE","ASC because worst-first is the useful ordering"],
 followups:["Why ASC?","What would you look at next for the worst partner?","Add median time-to-resolution."]},

{id:"s3",deck:"p2sql",kind:"sql",type:"open",
 q:"Partners who have sent **zero** messages in the last 30 days.",
 clarify:["Include partners created in the last 30 days, or only established ones?","Zero messages, or zero *successful* messages?"],
 model:"SELECT p.id, p.name\nFROM partners p\nLEFT JOIN messages m\n  ON m.partner_id = p.id\n AND m.sent_at >= CURRENT_DATE - INTERVAL '30 days'\nWHERE m.id IS NULL;\n\n-- or, often clearer:\nSELECT p.id, p.name\nFROM partners p\nWHERE NOT EXISTS (\n  SELECT 1 FROM messages m\n  WHERE m.partner_id = p.id\n    AND m.sent_at >= CURRENT_DATE - INTERVAL '30 days');",
 modelNote:"The date filter MUST live in the ON clause. Put it in WHERE and the LEFT JOIN collapses into an INNER JOIN, and you get zero rows back — the single most common SQL interview trap.",
 rubric:["Date condition in ON, not WHERE","WHERE m.id IS NULL to keep the non-matches","Knew the NOT EXISTS alternative","Could explain why WHERE breaks it"],
 followups:["Why does putting the date in WHERE break this?","Which version would you ship and why?","Now find partners whose volume dropped 50% vs the prior 30 days."]},

{id:"s4",deck:"p2sql",kind:"sql",type:"open",
 q:"For each partner, return only their **most recent** ticket.",
 clarify:["If two tickets share a timestamp, do I need exactly one row?","All columns, or just the id?"],
 model:"WITH ranked AS (\n  SELECT t.*,\n         ROW_NUMBER() OVER (PARTITION BY t.partner_id\n                            ORDER BY t.created_at DESC,\n                                     t.id DESC) AS rn\n  FROM tickets t\n)\nSELECT * FROM ranked WHERE rn = 1;",
 modelNote:"ROW_NUMBER not RANK — RANK would return two rows on a tie. The `t.id DESC` tiebreaker makes the result deterministic, which matters if this feeds a report that's supposed to be reproducible.",
 rubric:["ROW_NUMBER (guarantees one row) not RANK","Added a deterministic tiebreaker","Wrapped in a CTE because you can't filter a window fn in WHERE","Could explain why the CTE is required"],
 followups:["Why can't you put ROW_NUMBER() in the WHERE clause?","When would RANK be the right choice here?","Now the most recent per partner per error code."]},

{id:"s5",deck:"p2sql",kind:"sql",type:"open",
 q:"Daily message volume for the last 14 days, with the **day-over-day change**.",
 clarify:["Should days with zero messages appear as 0, or be missing?","Is the first day's delta NULL or 0?"],
 model:"WITH daily AS (\n  SELECT DATE_TRUNC('day', sent_at) AS d,\n         COUNT(*) AS n\n  FROM messages\n  WHERE sent_at >= CURRENT_DATE - INTERVAL '14 days'\n  GROUP BY 1\n)\nSELECT d,\n       n,\n       n - LAG(n) OVER (ORDER BY d) AS delta,\n       ROUND(100.0 * (n - LAG(n) OVER (ORDER BY d))\n             / NULLIF(LAG(n) OVER (ORDER BY d), 0), 1) AS pct\nFROM daily\nORDER BY d;",
 modelNote:"NULLIF guards the divide-by-zero when yesterday was 0. Also flag the gap problem: a day with no messages produces no row at all, so LAG compares to the wrong day — you'd need a date spine to fix it properly.",
 rubric:["LAG with ORDER BY inside OVER","NULLIF for divide-by-zero","RAISED the missing-days problem unprompted","Aggregated in a CTE before applying the window"],
 followups:["A day with zero messages breaks this. How would you fix it?","Now do it per partner.","7-day moving average instead?"]},

{id:"s6",deck:"p2sql",kind:"sql",type:"open",
 q:"Failure rate per template AND locale. Flag any combination above 5% failure with at least 100 messages.",
 clarify:["Does 'sent' count as success or as not-yet-delivered?","Should combinations with zero failures still appear?"],
 model:"SELECT template,\n       locale,\n       COUNT(*) AS total,\n       SUM(CASE WHEN status = 'failed' THEN 1 ELSE 0 END) AS failed,\n       ROUND(100.0 * SUM(CASE WHEN status = 'failed'\n                              THEN 1 ELSE 0 END)\n             / COUNT(*), 2) AS fail_pct\nFROM messages\nGROUP BY template, locale\nHAVING COUNT(*) >= 100\n   AND 100.0 * SUM(CASE WHEN status = 'failed'\n                        THEN 1 ELSE 0 END) / COUNT(*) > 5\nORDER BY fail_pct DESC;",
 modelNote:"You can't reference the `fail_pct` alias in HAVING on most engines, so the expression is repeated. Say that out loud — it shows you know the execution order rather than just copying a pattern.",
 rubric:["Grouped by both columns","Repeated the expression in HAVING (or used a CTE) and knew why","Two HAVING conditions combined","Ordered by the thing that matters operationally"],
 followups:["Rewrite it with a CTE so you don't repeat the expression.","This is a real Meta scenario — which error codes would you expect?","Now compare this week vs last week."]},

{id:"s7",deck:"p2sql",kind:"sql",type:"open",
 q:"Partners whose failure rate **increased** this week compared to last week.",
 clarify:["Week boundaries — calendar week or rolling 7 days?","Minimum volume to avoid noise from tiny partners?"],
 model:"WITH weekly AS (\n  SELECT partner_id,\n         CASE WHEN sent_at >= CURRENT_DATE - INTERVAL '7 days'\n              THEN 'this' ELSE 'last' END AS wk,\n         AVG(CASE WHEN status='failed' THEN 1.0 ELSE 0 END) AS rate,\n         COUNT(*) AS n\n  FROM messages\n  WHERE sent_at >= CURRENT_DATE - INTERVAL '14 days'\n  GROUP BY partner_id, 2\n),\npivoted AS (\n  SELECT partner_id,\n         MAX(CASE WHEN wk='this' THEN rate END) AS this_rate,\n         MAX(CASE WHEN wk='last' THEN rate END) AS last_rate,\n         MIN(n) AS min_n\n  FROM weekly GROUP BY partner_id\n)\nSELECT * FROM pivoted\nWHERE this_rate > last_rate\n  AND min_n >= 50\nORDER BY this_rate - last_rate DESC;",
 modelNote:"The MAX(CASE WHEN ...) pivot is a pattern worth memorising — it turns rows into columns so you can compare two periods side by side. The min-volume filter stops a partner who sent 2 messages dominating the list.",
 rubric:["Bucketed both periods in one pass","Pivoted with MAX(CASE WHEN...)","Added a volume floor to suppress noise","Ordered by the size of the regression"],
 followups:["Why the minimum volume filter?","Is a rate increase from 0.1% to 0.2% worth alerting on?","How would you make this a daily automated alert?"]},

{id:"s8",deck:"p2sql",kind:"sql",type:"open",
 q:"Monthly active partners: partners who sent at least one message, per month, for the last 6 months.",
 clarify:["Active = sent anything, or sent successfully?","Calendar months?"],
 model:"SELECT DATE_TRUNC('month', sent_at) AS mth,\n       COUNT(DISTINCT partner_id) AS active_partners,\n       COUNT(*) AS messages\nFROM messages\nWHERE sent_at >= DATE_TRUNC('month',\n                 CURRENT_DATE - INTERVAL '6 months')\nGROUP BY 1\nORDER BY 1;",
 modelNote:"COUNT(DISTINCT partner_id), not COUNT(*) — one partner sending 10,000 messages is still one active partner. That distinction is the entire question.",
 rubric:["COUNT(DISTINCT) for the partner count","DATE_TRUNC for month bucketing","Truncated the start of the range to a month boundary","Included raw volume alongside for context"],
 followups:["Now show partners who were active last month but not this month (churn).","Add a retention percentage.","How would you define 'active' more meaningfully?"]},

{id:"s9",deck:"p2sql",kind:"sql",type:"open",
 q:"Median-ish: return the **90th percentile** time-to-resolution per region, in hours.",
 clarify:["Only resolved tickets, or count unresolved as infinite?","Which percentile function does this engine have?"],
 model:"SELECT p.region,\n       ROUND(\n         PERCENTILE_CONT(0.9) WITHIN GROUP (\n           ORDER BY EXTRACT(EPOCH FROM\n                    (t.resolved_at - t.created_at)) / 3600.0\n         )::numeric, 1) AS p90_hours\nFROM tickets t\nJOIN partners p ON p.id = t.partner_id\nWHERE t.resolved_at IS NOT NULL\nGROUP BY p.region\nORDER BY p90_hours DESC;",
 modelNote:"Excluding unresolved tickets biases the number optimistically — the worst tickets are the ones still open. Saying that out loud is worth more than the syntax.",
 rubric:["Knew PERCENTILE_CONT / WITHIN GROUP exists","Converted the interval to hours","Filtered to resolved only","RAISED the survivorship bias — the real insight"],
 followups:["Why is excluding unresolved tickets misleading?","Why p90 and not the average?","If the engine has no percentile function, how would you approximate it?"]},

{id:"s10",deck:"p2sql",kind:"sql",type:"open",
 q:"Find data corruption: tickets whose `resolved_at` is **before** `created_at`, or whose partner_id doesn't exist in partners.",
 clarify:["Should NULL resolved_at count as corrupt?","Is partner_id a real foreign key, or unenforced?"],
 model:"-- Impossible timestamps\nSELECT id, created_at, resolved_at\nFROM tickets\nWHERE resolved_at < created_at;\n\n-- Orphaned rows\nSELECT t.id, t.partner_id\nFROM tickets t\nLEFT JOIN partners p ON p.id = t.partner_id\nWHERE p.id IS NULL;\n\n-- Or combined with a reason column:\nSELECT t.id,\n  CASE WHEN t.resolved_at < t.created_at THEN 'time_travel'\n       WHEN p.id IS NULL                 THEN 'orphan'\n  END AS problem\nFROM tickets t\nLEFT JOIN partners p ON p.id = t.partner_id\nWHERE t.resolved_at < t.created_at OR p.id IS NULL;",
 modelNote:"Anti-join for orphans is the same shape as 'partners with no messages'. Note that NULL resolved_at won't match `< created_at` — NULL comparisons are never TRUE, so unresolved tickets are correctly excluded here by accident. Say that you checked.",
 rubric:["Anti-join pattern for orphans","Knew NULL resolved_at silently won't match","Labelled the problem rather than just listing ids","Thought like someone auditing data, not just querying it"],
 followups:["How did orphans get there in the first place?","How would you prevent it?","Turn this into a daily data-quality check."]},

{id:"s11",deck:"p2sql",kind:"sql",type:"open",
 q:"Running total of tickets per day for the last 30 days.",
 clarify:["Running total resetting monthly, or cumulative across the window?"],
 model:"WITH daily AS (\n  SELECT DATE_TRUNC('day', created_at) AS d,\n         COUNT(*) AS n\n  FROM tickets\n  WHERE created_at >= CURRENT_DATE - INTERVAL '30 days'\n  GROUP BY 1\n)\nSELECT d, n,\n       SUM(n) OVER (ORDER BY d\n                    ROWS BETWEEN UNBOUNDED PRECEDING\n                             AND CURRENT ROW) AS running_total\nFROM daily\nORDER BY d;",

{id:"s12",deck:"p2sql",kind:"sql",type:"open",
 q:"A colleague's revenue query returns 3× the real number after they joined in a line-items table. Explain what happened and fix it.",
 code:"SELECT SUM(o.total)\nFROM orders o\nJOIN order_items i ON i.order_id = o.id;",
 clarify:["How many items per order on average?","Do they need anything FROM order_items in the output?"],
 model:"-- CAUSE: row fan-out. One order with 3 items becomes 3 rows,\n-- so o.total is summed three times.\n\n-- FIX 1 — don't join if you don't need the items:\nSELECT SUM(total) FROM orders;\n\n-- FIX 2 — pre-aggregate the child table to one row per order:\nWITH items AS (\n  SELECT order_id, COUNT(*) AS n_items, SUM(qty) AS units\n  FROM order_items GROUP BY order_id\n)\nSELECT SUM(o.total) AS revenue,\n       SUM(i.units)  AS units\nFROM orders o\nLEFT JOIN items i ON i.order_id = o.id;",
 modelNote:"The diagnostic habit worth stating: compare the row count before and after a join. If it grew, the join isn't one-to-one and every downstream SUM is suspect.",
 rubric:["Named fan-out as the cause","Asked whether the join is needed at all — simplest fix first","Pre-aggregated to restore one-row-per-order","Gave the row-count sanity check"],
 followups:["How would you have caught this before shipping?","When is SELECT DISTINCT the wrong fix for this?","Same problem in pandas merge — what does it look like?"]},

{id:"s13",deck:"p2sql",kind:"sql",type:"open",
 q:"Sessionize: group a partner's tickets into 'bursts' where consecutive tickets less than 1 hour apart belong to the same burst. Return the number of bursts per partner.",
 clarify:["Is the 1-hour gap measured from the previous ticket, or from the burst start?","Single ticket = one burst?"],
 model:"WITH gapped AS (\n  SELECT partner_id, created_at,\n         CASE WHEN created_at - LAG(created_at) OVER (\n                     PARTITION BY partner_id ORDER BY created_at)\n                   > INTERVAL '1 hour'\n              OR LAG(created_at) OVER (\n                     PARTITION BY partner_id ORDER BY created_at)\n                 IS NULL\n              THEN 1 ELSE 0 END AS is_new_burst\n  FROM tickets\n)\nSELECT partner_id, SUM(is_new_burst) AS bursts\nFROM gapped\nGROUP BY partner_id\nORDER BY bursts DESC;",
 modelNote:"The trick: mark each row as 'starts a new burst' or not, then just SUM the flags. You don't need to actually number the sessions to count them. (A running SUM of the flag would give you session ids if you did.)",
 rubric:["LAG partitioned per partner","Flag-then-sum rather than trying to number groups","Handled the first row (LAG is NULL)","Could extend it to session ids with a running SUM"],
 followups:["Now give each burst an id.","Return the longest burst per partner.","Why is a burst of tickets operationally interesting?"]},
