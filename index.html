{id:"t1",deck:"p2ai",kind:"speak",type:"open",
 q:"\"Walk me through a RAG pipeline you've actually built.\"",
 clarify:["(Just talk. Aim for ~90 seconds.)"],
 model:"ResearchPulse is the cleanest example. The problem: researchers\nhad papers they couldn't search meaningfully — keyword search\nmisses anything phrased differently.\n\nThe pipeline: ingest the documents, chunk them — and chunking\nis where most of the quality lives, too big and you retrieve\nnoise, too small and you lose the context that makes the passage\nmeaningful. Embed each chunk, store the vectors. At query time,\nembed the question, pull the top-k nearest chunks, and put those\nin the prompt with an instruction to answer only from the\nprovided sources and to say so when they don't cover it.\n\nThe thing I'd flag: when it gave a bad answer, the generator was\nalmost never the problem. It was retrieval — wrong chunks, or\nthe right document was never indexed. So the first thing I do\nwhen debugging RAG is print the retrieved passages. If a human\ncan't answer from them, the model has no chance either.",
 modelNote:"That last paragraph is the money. Anyone can describe RAG. Describing how it FAILS, and that you debug retrieval before the model, is what says you've operated one.",
 rubric:["Named a real project, not a generic pipeline","Explained chunking as a quality lever","Gave the debug-retrieval-first insight","Mentioned grounding instructions in the prompt"],
 followups:["How do you choose chunk size?","How would you evaluate whether retrieval is good?","How does this map to how a Meta Business Agent knows a merchant's catalogue?"]},

{id:"t2",deck:"p2ai",kind:"speak",type:"open",
 q:"\"You use LangGraph. Explain what a multi-agent system is — and when it's overkill.\"",
 clarify:["(~60 seconds. The second half matters more than the first.)"],
 model:"A multi-agent system splits a task across specialised agents\nthat each own a step and hand off to each other, with a graph\ndefining the control flow. In LangGraph you define nodes and\nedges explicitly, so the routing is deterministic code rather\nthan the model deciding what to do next.\n\nWhen it's overkill: most of the time, honestly. If a single\nprompt with good context does the job, adding agents buys you\nlatency, cost, and many more places to fail. Every hop is\nanother chance to lose context or compound an error.\n\nI reach for it when steps genuinely need different tools or\ndifferent context, and when I want an explicit, inspectable\ncontrol flow instead of one long opaque prompt. The debuggability\nis usually the real reason — I can see which node failed.",
 modelNote:"Saying 'most of the time it's overkill' about your own specialism is a strong signal. It reads as judgement rather than hype, and it's exactly the temperament a support-facing role needs.",
 rubric:["Defined it in one clean sentence","Was honest that it's often unnecessary","Named latency/cost/failure surface as the cost","Gave a real reason to use it — inspectable control flow"],
 followups:["What breaks in agent systems that doesn't break in a single-prompt chatbot?","How do you debug a multi-agent failure?","Where would Meta Business Agent sit on that spectrum?"]},

{id:"t3",deck:"p2ai",kind:"speak",type:"open",
 q:"\"A business is using an AI agent for customer support. How would you know if it's actually working?\"",
 clarify:["(~90 seconds. They're testing product sense, not ML theory.)"],
 model:"I'd separate offline and online.\n\nOffline: an eval set — real questions with expected answers,\nrun on every prompt or model change. Without it you're shipping\non vibes, and prompt changes routinely fix one case and break\nthree others.\n\nOnline, the metric I care about is containment paired with\nsatisfaction. Containment alone is gameable — an agent that\nnever escalates looks great and is quietly terrible. So:\nresolution rate, escalation rate, CSAT, and a wrong-answer rate\nfrom sampled human review. Plus latency and cost per\nconversation, because those decide whether it's viable at scale.\n\nAnd I'd slice all of it — by language, region, merchant size,\nquery type. An aggregate number hides the segment that's broken.\nA global CSAT of 4.4 can be 4.6 in English and 3.1 in Portuguese.",
 modelNote:"The 'containment alone is gameable' line and the slicing point are both things people learn by operating a system, not by reading about one.",
 rubric:["Split offline evals from online metrics","Named the gaming risk in containment","Included cost and latency as real constraints","Insisted on slicing the metrics"],
 followups:["Which single metric would you put on a dashboard for a merchant?","How do you build the eval set in the first place?","How would you detect quality drift over time?"]},

{id:"t4",deck:"p2ai",kind:"speak",type:"open",
 q:"\"A merchant's AI agent told a customer they could return an item after 90 days. The real policy is 30. Walk me through what you do.\"",
 clarify:["(This is the archetypal question for this role. ~2 minutes.)"],
 model:"First, contain it. How many customers got this answer? If it's\nsystematic, that's a commitment the merchant may have to honour,\nso the business impact is immediate and I'd escalate while I\ninvestigate rather than after.\n\nThen find where it came from, and there are only a few options.\nEither the correct policy was never in the knowledge base;\nor it was there but retrieval didn't surface it; or it surfaced\nand the model overrode it; or the source itself is stale — an\nold policy page that was never removed.\n\nI'd check them in that order because they're cheapest to rule\nout in that order. Print the retrieved context for that\nconversation — that single step usually settles it.\n\nThe fixes differ by cause. Missing content is a content problem.\nBad retrieval is chunking or indexing. Model override means the\nsystem prompt isn't constraining it to the sources. Stale source\nis a data hygiene process problem, and that one recurs unless\nyou fix the process.\n\nLonger term I'd want confidence-based handoff on policy\nquestions specifically — anything about money or commitments is\nexactly where you want a human in the loop.",
 modelNote:"Notice the structure: contain, diagnose in cost order, fix by cause, prevent. That's an incident-response shape, and it's what a support engineer is actually hired to do.",
 rubric:["Contained and escalated before fully diagnosing","Enumerated the small set of possible causes","Ordered the checks by cost","Distinguished the fix from the prevention"],
 followups:["Which of those causes is most common in practice?","How would you catch this before a customer did?","Should the agent answer policy questions at all?"]},

{id:"t5",deck:"p2ai",kind:"speak",type:"open",
 q:"\"When do you use RAG, when do you fine-tune, and when do you just write a better prompt?\"",
 clarify:["(~60 seconds. Crisp beats comprehensive.)"],
 model:"My default order is prompt, then RAG, then fine-tune — cheapest\nand most reversible first.\n\nPrompting for behaviour you can describe in words. It's free and\nyou can change it in a minute.\n\nRAG when the model needs facts it can't know: a merchant's\ncatalogue, prices, hours, policies. Anything that changes.\nThe decisive property is freshness — update the document,\nreindex, and the answer changes immediately. No retraining.\n\nFine-tuning for consistent style, tone, or output format at\nscale, or domain vocabulary the base model handles badly.\nNot for facts — you'd have to retrain every time a price changes,\nwhich is absurd.\n\nThe short version I'd give a partner: new knowledge is RAG,\nnew behaviour is fine-tuning, and try the prompt first.",
 modelNote:"'New knowledge → RAG, new behaviour → fine-tune' is a genuinely useful compression. Have it ready as the one-liner and expand only if asked.",
 rubric:["Gave a clear default ordering with a reason","Freshness as the deciding property for RAG","Explicitly said don't fine-tune for facts","Had a one-line version for a non-technical audience"],
 followups:["A merchant wants the agent to sound like their brand. Which one?","A merchant changes prices daily. Which one?","What's the cost difference in practice?"]},

{id:"t6",deck:"p2ai",kind:"speak",type:"open",
 q:"\"Tell me about a time you improved the performance of an AI system.\"",
 clarify:["(Your Fidelity inference-optimisation work. Make it STAR.)"],
 model:"[Fill this in with YOUR real numbers before the interview.]\n\nSITUATION — At Fidelity I was working on AI models serving\nfinancial-services workflows, and inference latency was hurting\nthe downstream experience.\n\nTASK — I owned bringing response times down without degrading\noutput quality.\n\nACTION — I profiled first rather than guessing where the time\nwent. [Which was it: model size, batching, redundant calls,\ndata fetch, cold starts?] I then [what you actually changed]\nand validated quality hadn't regressed by [how].\n\nRESULT — [latency before → after, or the proxy metric].\n\n--- WHAT MATTERS HERE ---\n\"I profiled before optimising\" is the sentence that separates\nengineers from people who guess. Even without a precise number,\n\"we measured, found X dominated, fixed X, and confirmed quality\nheld\" is a complete and credible answer.",
 modelNote:"This card is deliberately a template — I don't know your real numbers and inventing them would be worse than useless. Fill the brackets in today. An honest proxy ('cut it roughly in half', 'removed a whole class of slow requests') beats a made-up percentage.",
 rubric:["Profiled before optimising","Named the specific bottleneck","Confirmed quality didn't regress","Ended on a concrete result"],
 followups:["How did you know the quality hadn't dropped?","What would you try next?","What's the latency budget for a customer-facing chat agent?"]},

{id:"t7",deck:"p2ai",kind:"speak",type:"open",
 q:"\"What breaks in an agentic system that doesn't break in a normal chatbot?\"",
 clarify:["(~75 seconds. This is your differentiator — you've lived it.)"],
 model:"Three things.\n\nFirst, agents take actions, so a mistake has consequences beyond\na bad sentence. A chatbot that hallucinates says something wrong.\nAn agent that hallucinates issues a refund. So you need scoped\npermissions, confirmation for irreversible actions, and audit\nlogs of every tool call.\n\nSecond, retries stop being free. If a tool call times out you\ndon't know whether it executed. Retry without an idempotency key\nand you refund twice. That's a distributed-systems problem\nwearing an AI costume, and it's the failure I'd worry about most.\n\nThird, errors compound across steps. In a single prompt you get\none chance to be wrong. In a six-node graph, a small error at\nnode two silently poisons everything downstream, and the final\noutput looks confident and is nonsense. Which is why I want\nexplicit control flow and per-node tracing — so I can see which\nstep went wrong instead of re-reading one giant prompt.",
 modelNote:"The middle point ties your AI work directly to the 'distributed systems' line in the job description. That's not a coincidence — use it deliberately.",
 rubric:["Actions have consequences → guardrails","Retry ambiguity → idempotency","Error compounding → tracing","Explicitly bridged AI and distributed systems"],
 followups:["How would you make an agent's tool calls idempotent?","How do you debug which node failed?","What would you never let an agent do without a human?"]},

{id:"t8",deck:"p2ai",kind:"speak",type:"open",
 q:"\"Explain what an LLM is to a non-technical business partner.\"",
 clarify:["(~45 seconds. No jargon. This tests communication, not knowledge.)"],
 model:"It's a system that's read an enormous amount of text and got\nvery good at predicting what words come next. That sounds\nsimple, and it is — but at scale, predicting the next word well\nturns out to require understanding grammar, facts, tone, and\nreasoning patterns.\n\nThe practical consequence for you is the important part: it's\npredicting plausible text, not looking things up. So it can be\nfluent and completely wrong, with no signal that it's wrong.\nThat's why we ground it in your actual documents rather than\nrelying on what it absorbed in training — so its answers come\nfrom your policies, not its memory.",
 modelNote:"'Fluent and completely wrong, with no signal that it's wrong' is the sentence a business partner needs and rarely gets. Delivering it plainly is worth more than any technical depth here.",
 rubric:["No jargon at all","Landed next-token prediction in plain words","Connected it to a practical consequence for THEM","Explained grounding without saying 'RAG'"],
 followups:["Now explain hallucination to the same person.","They ask 'can we just make it never be wrong?' — answer.","Explain why it can't tell you how confident it is."]},

{id:"t9",deck:"p2ai",kind:"speak",type:"open",
 q:"\"How would you design the human-handoff logic for a business messaging agent?\"",
 clarify:["(~90 seconds. Product design question with a technical spine.)"],
 model:"I'd hand off on four triggers.\n\nExplicit — the customer asks for a human. That should always\nwork immediately and never be argued with.\n\nLow confidence — retrieval returned nothing relevant, or the\nmodel's answer isn't grounded in the sources. That's detectable:\nif the retrieved chunks don't cover the question, don't answer.\n\nCategory — some topics never get automated regardless of\nconfidence. Refunds, complaints, anything legal or medical,\nanything where being wrong is expensive. That's a policy\ndecision the business should own, not the model.\n\nSentiment or loop detection — the customer is frustrated, or\nyou've gone three turns without progress. Repetition is a very\ngood signal that the agent is stuck.\n\nAnd the handoff has to carry the full transcript. Making the\ncustomer repeat themselves is worse than never having automated\nit at all — it converts a neutral experience into a bad one.\n\nMeta's design has the business configure when handoff happens\nrather than the agent deciding, which I think is right —\nthe merchant knows their risk tolerance better than the model.",
 modelNote:"The last paragraph shows you read the product materials and formed a view. That combination — knowledge plus opinion — is what senior candidates do and junior ones don't.",
 rubric:["Multiple trigger types, not just 'low confidence'","Category-based rules owned by the business","Transcript carried across — the experience point","Referenced Meta's actual design choice with a view on it"],
 followups:["How do you measure whether handoff is working?","What if the business sets it too conservatively?","How would you detect a stuck loop?"]},

{id:"t10",deck:"p2ai",kind:"speak",type:"open",
 q:"\"How do you decide chunk size in a retrieval system?\"",
 clarify:["(~45 seconds. Specific, hands-on question.)"],
 model:"There's no universal number — it depends on the shape of the\ncontent and the shape of the questions.\n\nToo small and you lose the context that makes a passage\nmeaningful — you retrieve a sentence that needs the paragraph\naround it to mean anything. Too large and you dilute the\nembedding, so it matches everything weakly and nothing strongly,\nand you burn context window on irrelevant text.\n\nIn practice I start by chunking on natural boundaries —\nsections, headings, paragraphs — rather than a fixed character\ncount, because a chunk that respects document structure is\nusually a chunk that stands alone. Then overlap adjacent chunks\nslightly so an answer that straddles a boundary isn't lost.\n\nAnd then I'd actually measure it: take real questions, check\nwhether the right passage is in the top-k. That's a retrieval\nmetric you can optimise directly, separately from answer quality.",
 modelNote:"'Chunk on natural boundaries, not fixed size' plus 'measure retrieval separately from generation' are both practitioner answers. The second one especially.",
 rubric:["Explained the trade-off in both directions","Preferred semantic boundaries to fixed size","Mentioned overlap","Said how you'd MEASURE it, not just tune by feel"],
 followups:["How would you build that retrieval eval set?","What if documents are tables rather than prose?","What's top-k and how do you choose it?"]},

{id:"t11",deck:"p2ai",kind:"speak",type:"open",
 q:"\"What's the biggest risk in deploying AI in a customer-facing business product?\"",
 clarify:["(~60 seconds. Have a view, don't list everything.)"],
 model:"Confidently wrong answers, and specifically at the point where\nsomeone acts on them.\n\nThe reason it's the biggest risk isn't the error rate — it's\nthat there's no signal. A wrong answer looks exactly like a right\none. The customer can't tell, and often the business can't\neither until someone complains. A system that failed loudly\nwould be much easier to operate.\n\nFor a business agent that means a wrong price, a wrong delivery\ndate, or a policy the merchant never agreed to — and the merchant\nmay be held to it. So the mitigation isn't only technical\ngrounding; it's also deciding what the agent is allowed to speak\nabout at all, and monitoring what it actually said rather than\nassuming it behaved.\n\nSecond place would be uneven quality across languages and\nregions, because that hides inside an aggregate metric and\ndisproportionately affects the markets you understand least.",
 modelNote:"Picking one risk and justifying it beats listing six. The 'no signal' framing is the sharp part — it explains why this is harder than ordinary software failure.",
 rubric:["Committed to one primary risk","Explained WHY it's worse than other failures — no signal","Grounded it in the business consequence","Second-order point about hidden segment failures"],
 followups:["How would you monitor what the agent actually said?","Is a lower error rate enough? Why not?","What would you refuse to automate?"]},

{id:"t12",deck:"p2ai",kind:"speak",type:"open",
 q:"\"Explain embeddings and vector search — assume I'm technical but not an ML person.\"",
 clarify:["(~45 seconds.)"],
 model:"An embedding turns a piece of text into a list of numbers —\na point in a high-dimensional space — where things that mean\nsimilar things land near each other. \"Where's my order?\" and\n\"delivery status?\" share almost no words but end up close\ntogether, because the model that produced them was trained on\nmeaning rather than spelling.\n\nVector search is then just: embed the question, and find the\nnearest stored points. That's why it can match a customer's\nphrasing to a document that never uses their words — which\nkeyword search fundamentally can't do.\n\nThe caveat: near in that space means 'similar', not 'correct'.\nIt'll happily return the closest thing it has even when nothing\nrelevant exists, so you need a relevance threshold or you'll\nground your answer in the least-bad garbage.",
 modelNote:"The caveat at the end is the practitioner tell. Everyone explains embeddings; few mention that similarity search always returns *something*.",
 rubric:["Explained meaning-space in plain terms","Gave the concrete paraphrase example","Contrasted with keyword search","Named the always-returns-something failure mode"],
 followups:["How would you set that relevance threshold?","When would keyword search actually beat this?","What's a vector database doing that a normal DB can't?"]},

{id:"t13",deck:"p2ai",kind:"speak",type:"open",
 q:"\"Where do you think AI agents for business messaging go over the next two years?\"",
 clarify:["(~60 seconds. They want curiosity and a view, not a prediction market.)"],
 model:"I'd say the shift is from answering to acting.\n\nRight now most business agents are very good at responding —\nanswering questions, surfacing a product. The obvious next step,\nand the one Meta is clearly building toward with the platform\ntier connecting to systems like Shopify and Zendesk, is agents\nthat complete the transaction: place the order, reschedule the\nappointment, process the return.\n\nThat's a much harder engineering problem than it looks, because\nthe moment an agent writes to a real system you inherit every\ndistributed-systems concern — idempotency, partial failure,\nreconciliation — on top of the model being probabilistic.\n\nWhich is honestly a large part of why this role interests me.\nThe interesting problems in the next two years aren't going to\nbe about making the model smarter. They're going to be about\nmaking an unreliable component behave dependably inside a real\nbusiness's systems. That's an engineering and support problem\nas much as an ML one.",
 modelNote:"This answer does double duty — it demonstrates product awareness AND plants your 'why this role' reasoning without being asked. If you land one answer in this round, make it this one.",
 rubric:["Had an actual thesis, not a list of trends","Grounded it in Meta's real product direction","Named the hard part honestly","Connected it back to why you want THIS role"],
 followups:["What's the hardest part of letting an agent take actions?","What would you build first?","What are you personally most curious about right now?"]},

{id:"t14",deck:"p2ai",type:"teach",title:"If they go deeper than you can go",body:"\"I'm not sure — but if I had to reason about it, I'd say…\" and then actually reason.",note:"The guide recommends this exact phrasing. In a round explicitly testing awareness rather than expertise, honest reasoning outscores a confident wrong answer every time."}
];

{id:"r1",deck:"p2cv",kind:"speak",type:"open",
 q:"\"Walk me through your background.\"\n\nThe opener. Almost guaranteed.",
 clarify:["(~2 minutes. Practise until it's smooth but not recited.)"],
 model:"Shape it as a line that ARRIVES here, not a list of jobs.\n\n\"I'm a CS grad who went straight into building conversational\nand AI products. I started on the interface side of chatbots and\nvoice at 21K School, which is where I got interested in what\nactually makes these systems usable rather than just functional.\n\nAt Fidelity I moved to the engineering side of AI — deploying\nmodels for financial services, working in Snowflake and SQL,\nand doing a lot of inference and backend optimisation.\n\nAfter that I spent a year going deep on agentic AI specifically —\nbuilding and publishing RAG and multi-agent systems, which is\nwhat led into my current role as founding AI engineer at\nKronosX, where I orchestrate multi-agent systems with LangGraph\nand LlamaIndex for enterprise data workflows.\n\nSo the through-line is: I've built AI systems and I've had to\nmake them work for real users. Which is why this role is\ninteresting to me — Business Agents are exactly that problem\nat a scale I can't get anywhere else.\"",
 modelNote:"Every sentence points forward. The last line hands them the 'why this role' answer before they ask. Don't narrate every date — they have the resume.",
 rubric:["Under two minutes","A through-line, not a chronology","Ended by connecting to THIS role","Didn't apologise for or over-explain any period"],
 followups:["Tell me more about the KronosX work.","Why the move from Fidelity?","What's the year in the middle?"]},

{id:"r2",deck:"p2cv",kind:"speak",type:"open",
 q:"**The hard one.** \"You're a Founding AI Engineer at an AI startup. This is a support engineering role. Why would you want this?\"",
 clarify:["(Expect this. Prepare it more than any other answer.)"],
 model:"Do not: apologise, call it a step up, or hint the startup is\nstruggling. Do: give a reason that's true and specific.\n\nThe three strongest honest angles —\n\nSCALE. \"I've built agentic systems 0→1. What I haven't done is\nsee them run for a million businesses. Meta Business Agent is\nthe same technology I work on daily, operating at a scale that\nsimply doesn't exist in a startup. That's not a small difference\nin degree — it's a different set of problems.\"\n\nWHERE THE TRUTH LIVES. \"I've been on the building side. The\nhonest thing about building AI systems is that you learn far\nmore from how they fail with real users than from how they work\nin development. Support engineering sits exactly on that\nfeedback loop. I want a year of seeing what actually breaks for\nreal businesses — that makes me a better engineer than another\nyear of building in a vacuum.\"\n\nTHE ROLE ITSELF. \"And reading the description, this isn't a\nticket-closing role. It says you'd expect me to evaluate partner\nexperience and influence the product roadmap. That's a product\nengineering job with a support surface, and it's the part I want.\"\n\nThen stop. Don't over-sell.",
 modelNote:"Pick ONE as your lead — probably scale — and keep the others as follow-up material. Delivering all three at once sounds rehearsed and slightly desperate. One clear reason, said calmly, is far more convincing.",
 rubric:["Did not disparage the current company","Gave a specific reason, not 'I want a new challenge'","Referenced the actual JD language about roadmap influence","Sounded calm rather than over-eager"],
 followups:["Isn't this a step down in title?","Won't you be bored?","What if a startup offers you a founding role in six months?"]},

{id:"r3",deck:"p2cv",kind:"speak",type:"open",
 q:"Follow-up: **\"Honestly — isn't this a step down for you?\"**",
 clarify:["(They're testing whether you'll be resentful or leave quickly.)"],
 model:"Answer it head-on. Ducking it makes it worse.\n\n\"On title, at a small startup, maybe. On the work, no — and\ntitle at a nine-person company isn't really comparable to\nanything anyway. Founding engineer means I do everything,\nincluding a lot that isn't the part I'm good at.\n\nWhat I'd be trading is scope for scale, and at this point in my\ncareer that's the trade I want. I'd rather solve harder versions\nof fewer problems, with people who've solved them before, than\nkeep solving easy versions of everything.\"\n\nIf they press on money or level, be straightforward: you're\nevaluating the role, the team and the trajectory, not the title.",
 modelNote:"'Founding engineer means I do everything, including a lot that isn't the part I'm good at' is disarming and true of nearly every founding role. It signals self-awareness rather than defensiveness.",
 rubric:["Addressed it directly instead of deflecting","Framed as a deliberate trade, not a compromise","Showed self-awareness about startup titles","No resentment in the tone"],
 followups:["What would make you stay five years?","What would make you leave?","How do you handle work that's below your level?"]},

{id:"r4",deck:"p2cv",kind:"speak",type:"open",
 q:"**\"What would stop you leaving in six months when another startup offers you a founding role?\"**",
 clarify:["(The retention question. Give them something concrete to believe.)"],
 model:"Vague reassurance fails here. Name the specific thing that\nholds you.\n\n\"Two things would keep me. First, I don't think I can get this\nproblem anywhere else — agentic AI operating for a million\nbusinesses across three surfaces is a data set and a problem\nspace that exists at maybe two companies on earth. I'd be\nleaving that to go back to a smaller version of what I already\ndo.\n\nSecond, what actually makes me leave a job is when I stop\nlearning. From what I understand of this team, the escalations\nyou see are the frontier of what breaks in agentic AI. I don't\nthink I run out of that quickly.\"\n\nAnd then be honest: \"I can't promise a number of years and I\nwouldn't believe anyone who did. What I can tell you is what\nkeeps me somewhere, and it's problem quality.\"",
 modelNote:"That final honest caveat is stronger than a promise. Interviewers have heard 'I'm looking for a long-term home' from everyone who then left in eight months.",
 rubric:["Named something Meta specifically offers","Was honest rather than making an unbelievable promise","Framed retention around learning, not loyalty","Showed you'd researched what the team actually does"],
 followups:["What does 'stop learning' look like for you?","What if the work is more support than engineering?","What would your first 90 days look like?"]},

{id:"r5",deck:"p2cv",kind:"speak",type:"open",
 q:"\"You have **Self-Employed, AI Researcher** from Oct 2024 to Sep 2025. Tell me about that year.\"",
 clarify:["(Be concrete and unapologetic. Vagueness here reads as concealment.)"],
 model:"The failure mode is sounding evasive. Lead with output.\n\n\"That was a deliberate period of going deep on agentic AI while\nit was moving fastest. Concretely, I built and published\n[Auto-Augment Agent — an autonomous agent for processing and\naugmenting AI pipelines] and [ResearchPulse — a RAG application\nfor document retrieval and research synthesis], both on GitHub.\n\nWhat I got out of it was hands-on depth in LangGraph, RAG\narchitecture and agent design that I couldn't have got inside\na role that wasn't doing that yet — and it's directly what I was\nhired at KronosX to do.\"\n\nIf you were also job-hunting or freelancing, say so plainly.\n\"I was also looking for the right role during that time\" is a\nnormal sentence. Trying to hide it is what creates doubt.",
 modelNote:"Named artifacts on GitHub are the strongest possible evidence — they're checkable. Have the repo links ready and offer them. \"You can look at the code\" ends this conversation immediately.",
 rubric:["Led with concrete built things, not with justification","Named the specific projects","Connected it to what you do now","Honest about any job-hunting without dwelling"],

{id:"r7",deck:"p2cv",kind:"speak",type:"open",
 q:"**The JD asks for distributed systems experience.** \"Tell me about your distributed systems background.\"\n\nThis is your thinnest claim. Prepare it properly.",
 clarify:["(Don't overclaim. Translate what you genuinely have.)"],
 model:"Be honest about the shape of your experience, then show the\nconcepts are real to you.\n\n\"I'd frame it honestly: I haven't been a distributed systems\nengineer building consensus protocols. What I have done is build\nsystems that hit distributed-systems problems constantly.\n\nMulti-agent orchestration is a coordination problem — I've dealt\nwith partial failure where one node fails and downstream nodes\ncarry on with bad state, with retries that need to be safe to\nrepeat, and with timeouts where you genuinely don't know whether\nthe call executed. At Fidelity I worked on backend services and\ninference paths where latency and reliability were the whole job.\n\nThe concepts I use constantly: idempotency, exponential backoff\nwith jitter, at-least-once delivery meaning your consumer has to\nbe idempotent, dead-letter queues for what you can't process.\n\nSo — not deep infrastructure experience. But these aren't\nvocabulary to me, they're things I've had to get right.\"",
 modelNote:"Claiming depth you don't have is the fastest way to fail this interview, because the follow-up will expose it. Honest translation plus demonstrable fluency in the concepts is a much stronger position — and it's true.",
 rubric:["Did not overclaim","Translated agent orchestration into distributed-systems terms","Named specific concepts fluently and correctly","Was explicit about the boundary of your experience"],
 followups:["Explain idempotency to me.","Why does jitter matter in backoff?","What does at-least-once delivery force you to do?"]},

{id:"r8",deck:"p2cv",kind:"speak",type:"open",
 q:"**Also from the JD:** \"Tell me about a time you troubleshot an API integration problem.\"",

{id:"r9",deck:"p2cv",kind:"speak",type:"open",
 q:"\"Your resume says you *optimized inference performance* and *reduced latency* at Fidelity. By how much, and how?\"",
 clarify:["(Every vague resume claim invites this. Have the numbers.)"],
 model:"This is the most predictable question on your resume, because\nthe claim has no number attached to it.\n\nFill this in before the interview:\n  - What was slow, specifically?\n  - How did you find out what was slow? (Profiling beats guessing)\n  - What did you change?\n  - Before → after. Even approximate.\n  - How did you confirm quality didn't regress?\n\nIf you genuinely don't have the number, do NOT invent one.\nUse an honest proxy:\n  \"I don't have the exact figure to hand, but it was roughly\n   [halved / cut from seconds to sub-second], and the way we\n   knew was [dashboard / p95 latency / user complaints stopping].\"\n\nAn honest approximation with a real mechanism beats a precise\nnumber you can't defend — because the follow-up is always 'how\ndid you measure that?'",
 modelNote:"Interviewers rarely verify numbers. They absolutely do notice when a number is followed by an answer that can't explain how it was measured. Prepare the mechanism more carefully than the figure.",
 rubric:["Had a specific bottleneck, not 'the system was slow'","Profiled rather than guessed","Gave a before/after, even approximate","Could explain how it was measured"],
 followups:["How did you know that was the bottleneck?","What did you try that didn't work?","How did you confirm output quality held?"]},

{id:"r10",deck:"p2cv",kind:"speak",type:"open",
 q:"\"You say you're *orchestrating multi-agent AI systems*. Give me a concrete example — what does one of those systems actually do?\"",

 modelNote:"Have exactly one system you can describe for three minutes at any depth they push to. Depth on one beats breadth on four every time.",
 rubric:["Started with the business problem, not the architecture","Explained WHY the work is split across agents","Named something that was genuinely hard","Quantified the value"],
 followups:["Why agents instead of one prompt?","How do you test it?","What's the failure mode you worry about most?"]},

{id:"r12",deck:"p2cv",kind:"speak",type:"open",

{id:"r13",deck:"p2cv",kind:"speak",type:"open",

 model:"Choose a bug that was hard to *find*, not hard to type. Ideal\nqualities: intermittent, misleading symptom, wrong first\nhypothesis, and a systematic narrowing that got you there.\n\nStructure:\n  \"The symptom was [X], which pointed at [wrong thing].\n   I initially thought [wrong hypothesis] — and I was wrong.\n   What actually narrowed it was [the method: bisecting, diffing\n   working vs failing, adding logging at layer boundaries,\n   reproducing minimally].\n   The cause turned out to be [Y], which was surprising because\n   [why].\n   I fixed it by [Z] and then [prevention].\"\n\nStrong candidates from your work:\n  - Non-deterministic agent/LLM behaviour — genuinely hard\n    because it doesn't reproduce reliably\n  - A RAG system giving confidently wrong answers where the\n    retrieval was the culprit, not the model\n  - Anything intermittent in an API integration\n\nInclude the wrong hypothesis. It's the most credible part.",
 modelNote:"Non-deterministic LLM bugs are an unusually good answer here — most engineers have never had to debug something that behaves differently on identical input, and explaining how you approach that is memorable.",
 rubric:["The diagnosis was the hard part, not the fix","Admitted a wrong first hypothesis","Named a systematic narrowing technique","Ended with how you prevented recurrence"],
 followups:["How do you debug something that isn't reproducible?","What if you'd had no logs?","How long did it take, and what would make it faster next time?"]},

function shuffle(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function md(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
               .replace(/\*([^*\n]+)\*/g,"<i>$1</i>")
               .replace(/`([^`]+)`/g,"<code>$1</code>")
               .replace(/\n/g,"<br>");
}
const HLRE=/(#[^\n]*|--[^\n]*)|('[^'\n]*'|"[^"\n]*")|\b(SELECT|FROM|WHERE|GROUP BY|ORDER BY|HAVING|LEFT JOIN|INNER JOIN|JOIN|ON|AND|OR|NOT|NULL|IS|AS|WITH|CASE|WHEN|THEN|ELSE|END|COUNT|SUM|AVG|MAX|MIN|ROUND|COALESCE|NULLIF|DISTINCT|OVER|PARTITION BY|ROW_NUMBER|RANK|DENSE_RANK|LAG|LEAD|DATE_TRUNC|PERCENTILE_CONT|WITHIN GROUP|EXTRACT|INTERVAL|LIMIT|IN|EXISTS|def|class|for|in|if|elif|else|return|import|from|try|except|with|print|lambda|True|False|None|while|break|continue|self)\b|(\b\d+(?:\.\d+)?\b)/g;
function hlLine(line){
  let out="",last=0,m; HLRE.lastIndex=0;
  while((m=HLRE.exec(line))!==null){
    out+=esc(line.slice(last,m.index));
    const t=esc(m[0]);
    if(m[1])      out+='<span class="c">'+t+'</span>';
    else if(m[2]) out+='<span class="s">'+t+'</span>';
    else if(m[3]) out+='<span class="k">'+t+'</span>';
    else          out+='<span class="n">'+t+'</span>';
    last=m.index+m[0].length;
  }
  return out+esc(line.slice(last));
}
function hl(code){
  return String(code).split("\n").map(function(line){
    return '<span class="ln">'+(line?hlLine(line):"\u00a0")+"</span>";
  }).join("");
}

/* ---------- HOME ---------- */
function deckStats(d){
  const q=d.cards.filter(c=>c.type==="q"||c.type==="open").length;
  const seen=d.cards.filter(c=>S.done[c.id]).length;
  return {total:d.cards.length,q,seen,pct:Math.round(seen/d.cards.length*100)};
}
function missedIn(part){
  return Object.keys(S.miss).filter(id=>S.miss[id]&&ALL[id]&&
    part.decks.some(d=>d.cards.some(c=>c.id===id))).map(id=>ALL[id]);
}
function renderHome(){
  const P=PARTS[S.part]||PARTS[0];
  let totalC=0,seenC=0,scored=0,good=0;
  P.decks.forEach(d=>{const s=deckStats(d);totalC+=s.total;seenC+=s.seen;});
  P.decks.forEach(d=>d.cards.forEach(c=>{
    if(c.type==="q"&&S.right[c.id]!==undefined){scored++;if(S.right[c.id])good++;}
    if(c.type==="open"&&S.grade[c.id]){scored++;if(S.grade[c.id]==="ok")good++;}
  }));
  const misses=missedIn(P);
  let h=`
  <div class="kicker">Meta &middot; Business Support Engineer</div>
  <h1>Screening drill deck</h1>
  <p class="sub">Two parts. Recall first, then perform.</p>
  <div class="seg">
    ${PARTS.map((p,i)=>`<button data-part="${i}" class="${i===S.part?'on':''}">${p.name}<small>${p.tag}</small></button>`).join("")}
  </div>
  <p class="partnote">${P.note}</p>
  <div class="statrow">
    <div class="stat"><b>${Math.round(seenC/totalC*100)}%</b><span>covered</span></div>
    <div class="stat"><b>${scored?Math.round(good/scored*100):0}%</b><span>${S.part===0?'first-try':'nailed'}</span></div>
    <div class="stat"><b>${misses.length}</b><span>to redo</span></div>
  </div>`;
  P.decks.forEach((d,i)=>{
    const s=deckStats(d), C=2*Math.PI*19, off=C*(1-s.pct/100);
    h+=`<button class="deck" data-deck="${i}">
      <div class="ring">
        <svg width="46" height="46"><circle cx="23" cy="23" r="19" stroke="#252c37" stroke-width="3.5" fill="none"/>
        <circle cx="23" cy="23" r="19" stroke="${s.pct===100?'#22c55e':'#3b82f6'}" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
        <i>${s.pct}</i></div>
      <div class="dmeta"><div class="dname">${d.name}</div><div class="ddesc">${s.total} cards &middot; ${d.desc}</div></div>
      <div class="chev">&#8250;</div></button>`;
  });
  h+=`<button class="ghost" id="reviewbtn">${misses.length?`&#8635; Redo the ${misses.length} you missed`:`&#10003; Nothing flagged to redo`}</button>`;
  h+=`<div class="tip">${S.part===0
    ? `<b>Part 1.</b> Swipe up for the next card, down to go back. Code blocks scroll sideways. Question cards won't let you past until you answer.`
    : `<b>Part 2.</b> No typing. Read the walkthrough, tap Got it or Review later, swipe up. Built for a phone.`}</div>`;
  home.innerHTML=h;
  home.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.part=+b.dataset.part;save();renderHome();});
  home.querySelectorAll(".deck").forEach(b=>b.onclick=()=>{const d=P.decks[+b.dataset.deck];open(d.cards,d.k);});
  document.getElementById("reviewbtn").onclick=()=>{
    const m=missedIn(P); if(!m.length){toast("Nothing flagged yet");return;} open(m,"__review");};
}

/* ---------- PLAYER ---------- */
const home=document.getElementById("home"),player=document.getElementById("player"),
      track=document.getElementById("track"),barfill=document.getElementById("barfill"),
      countEl=document.getElementById("count"),hintEl=document.getElementById("hint"),
      toastEl=document.getElementById("toast");
let seq=[],idx=0,deckKey="",H=0;

function toast(m){toastEl.textContent=m;toastEl.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove("on"),1700);}

function open(cards,key){
  deckKey=key;
  seq=cards.map(c=>({card:c,state:null,revealed:!!S.grade[c.id]}));
  seq.push({card:{type:"end"},state:null});
  idx=(key!=="__review"&&S.pos[key])?Math.min(S.pos[key],seq.length-1):0;
  home.classList.add("hide"); player.classList.add("on");
  requestAnimationFrame(()=>{H=track.parentElement.clientHeight;build();go(idx,false);});
}
function close(){player.classList.remove("on");home.classList.remove("hide");home.scrollTop=0;renderHome();}
document.getElementById("back").onclick=close;

function build(){
  track.innerHTML="";
  seq.forEach((s,i)=>{
    const el=document.createElement("div");
    el.className="slide"; el.style.top=(i*100)+"%";
    el.appendChild(renderCard(s,i));
    track.appendChild(el);
  });
}
function rebuildOne(i){const el=track.children[i];el.innerHTML="";el.appendChild(renderCard(seq[i],i));}
function reflow(){H=track.parentElement.clientHeight;[...track.children].forEach((el,i)=>el.style.top=(i*100)+"%");go(idx,false);}

const KIND={code:["code","Python pattern"],sql:["sql","SQL pattern"],speak:["speak","What to say"]};

function renderCard(s,i){
  const c=s.card, d=document.createElement("div"); d.className="card";

  if(c.type==="end"){
    let n=0,ok=0;
    seq.forEach(x=>{
      if(x.card.type==="q"&&!x.card.__isRetry){n++;if(x.state==="ok")ok++;}
      if(x.card.type==="open"&&S.grade[x.card.id]){n++;if(S.grade[x.card.id]==="ok")ok++;}
    });
    const missNow=seq.filter(x=>x.state==="no"||(x.card.id&&S.miss[x.card.id])).length;
    d.innerHTML=`<div class="done">
      <div class="big">${n?Math.round(ok/n*100):100}%</div>
      <div class="lbl">${ok} of ${n} clean</div>
      <div class="act">
        ${missNow?`<button class="btn" id="rev">Redo the ${missNow} you flagged</button>`:``}
        <button class="btn ${missNow?'sec':''}" id="hm">Back to decks</button>
        <button class="btn sec" id="rs">Restart this deck</button>
      </div></div>`;
    setTimeout(()=>{
      const a=d.querySelector("#hm"); if(a)a.onclick=close;
      const b=d.querySelector("#rs"); if(b)b.onclick=()=>{S.pos[deckKey]=0;save();open(seq.filter(x=>x.card.type!=="end"&&!x.card.__gen).map(x=>x.card),deckKey);};
      const r=d.querySelector("#rev"); if(r)r.onclick=()=>{const m=seq.filter(x=>x.state==="no"||(x.card.id&&S.miss[x.card.id])).map(x=>x.card);open(m,"__review");};
    },0);
    return d;
  }

  /* ---------- OPEN = TEACH WALKTHROUGH (no typing) ---------- */
  if(c.type==="open"){
    const k=KIND[c.kind]||KIND.speak;
    const speak=c.kind==="speak";
    let h=`<div class="tagrow"><span class="tag ${k[0]}">${k[1]}</span></div>`;
    h+=`<p class="qtext">${md(c.q)}</p>`;
    if(c.code)h+=`<pre>${hl(c.code)}</pre>`;
    h+=`<div class="saybox">${speak
      ? "Read the script. Then say it out loud once. You don't need to type."
      : "Don't write code. Learn the pattern, then the interview-ready version."}</div>`;
    if(c.clarify&&c.clarify.length){
      h+=`<div class="mhead">Ask this first</div><div class="ask">${c.clarify.map(x=>`<div>${md(x)}</div>`).join("")}</div>`;
    }
    if(c.modelNote)h+=`<div class="mhead">Why this</div><div class="note">${md(c.modelNote)}</div>`;
    h+=`<div class="mhead">${speak?"What to say":"The answer"}</div><pre>${hl(c.model)}</pre>`;
    if(c.rubric&&c.rubric.length)
      h+=`<div class="mhead">They score these</div><div class="rub">${c.rubric.map(x=>`<div>${md(x)}</div>`).join("")}</div>`;
    if(c.followups&&c.followups.length)
      h+=`<div class="mhead">If they ask</div><div class="fup">${c.followups.map(x=>`<div>&rsaquo; ${md(x)}</div>`).join("")}</div>`;
    const g=S.grade[c.id];
    h+=`<div class="gradelbl">Did this land?</div>
        <div class="grade">
          <button class="g1 ${g==="ok"?"sel":""}" data-g="ok">Got it</button>
          <button class="g3 ${g==="miss"?"sel":""}" data-g="miss">Review later</button>
        </div>`;
    d.innerHTML=h;
    if(!S.done[c.id]){S.done[c.id]=true;save();}
    d.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
      const val=b.dataset.g;
      S.grade[c.id]=val; S.miss[c.id]=(val!=="ok"); S.done[c.id]=true; save();
      rebuildOne(i); updChrome();
    });
    return d;
  }

  /* ---------- MCQ + TEACH ---------- */
  const kind=c.__isReteach?["again","Try this angle"]:c.__isRetry?["retry","Your turn again"]:c.type==="q"?["quiz","Question"]:["learn","Learn"];
  let h=`<div class="tagrow"><span class="tag ${kind[0]}">${kind[1]}</span></div>`;
  if(c.type==="q"){
    if(!s.order)s.order=shuffle(c.opts.length);
    h+=`<p class="qtext">${md(c.q)}</p>`;
    if(c.code)h+=`<pre>${hl(c.code)}</pre>`;
    h+=`<div class="opts">`;
    s.order.forEach((orig,k)=>{
      let cls="opt";
      if(s.state){ if(orig===c.ans)cls+=" ok"; else if(orig===s.picked)cls+=" no"; else cls+=" dead"; }
      h+=`<button class="${cls}" data-k="${orig}"><span class="ltr">${"ABCDEF"[k]}</span><span>${md(c.opts[orig])}</span></button>`;
    });
    h+=`</div>`;
    if(s.state){const good=s.state==="ok";
      h+=`<div class="verdict ${good?'good':'bad'}"><h4>${good?"Correct":"Not quite"}</h4><p>${md(c.why)}</p></div>`;}
  }else{
    if(c.title)h+=`<h2>${md(c.title)}</h2>`;
    if(c.body)h+=`<p class="body">${md(c.body)}</p>`;
    if(c.code)h+=`<pre>${hl(c.code)}</pre>`;
    if(c.note)h+=`<div class="note">${md(c.note)}</div>`;
  }
  d.innerHTML=h;
  if(c.type==="q"&&!s.state)d.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(i,+b.dataset.k));
  return d;
}

function answer(i,pick){
  const s=seq[i],c=s.card, ok=pick===c.ans;
  s.picked=pick; s.state=ok?"ok":"no";
  if(!c.__isRetry&&!c.__isReteach){
    if(S.right[c.id]===undefined)S.right[c.id]=ok;
    S.miss[c.id]=!ok;
  }
  S.done[c.id]=true;
  if(!ok&&c.reteach&&!s.expanded){
    s.expanded=true;
    const rt={type:"teach",id:c.id+"_rt",__isReteach:true,title:c.reteach.title,body:c.reteach.body,code:c.reteach.code,note:c.reteach.note,__gen:true};
    const ins=[{card:rt,state:null}];
    if(c.retry)ins.push({card:{type:"q",id:c.id+"_rq",__isRetry:true,q:c.retry.q,code:c.retry.code,opts:c.retry.opts,ans:c.retry.ans,why:c.retry.why,__gen:true},state:null});
    seq.splice(i+1,0,...ins);
    save(); build(); go(i,false);
    setTimeout(()=>{if(idx===i)go(i+1,true);},480);
    return;
  }
  save(); rebuildOne(i); updChrome();
  if(ok)setTimeout(()=>{if(idx===i)go(i+1,true);},620);
}

function go(n,anim){
  n=Math.max(0,Math.min(n,seq.length-1)); idx=n;
  track.style.transition=anim?"transform .34s cubic-bezier(.32,.72,.3,1)":"none";
  track.style.transform=`translate3d(0,${-n*H}px,0)`;
  const c=seq[n].card;
  if(c.id&&c.type==="teach"&&!c.__gen)S.done[c.id]=true;
  if(deckKey&&deckKey!=="__review")S.pos[deckKey]=n;
  save(); updChrome();
}
function updChrome(){
  barfill.style.width=((idx)/(seq.length-1))*100+"%";
  countEl.textContent=(idx+1)+"/"+seq.length;
  const s=seq[idx],c=s.card;
  if(c.type==="end"){hintEl.textContent="";hintEl.classList.remove("pulse");}
  else if(c.type==="q"&&!s.state){hintEl.textContent="pick an answer to continue";hintEl.classList.remove("pulse");}
  else if(c.type==="open"&&!S.grade[c.id]){hintEl.textContent="got it, or review later";hintEl.classList.remove("pulse");}
  else{hintEl.textContent="swipe up ↑";hintEl.classList.add("pulse");}
}
function blockReason(){
  const s=seq[idx],c=s.card;
  if(c.type==="q"&&!s.state)return "Answer this one first";
  if(c.type==="open"&&!S.grade[c.id])return "Tap Got it or Review later";
  return null;
}
function canForward(){const r=blockReason(); if(r){toast(r);return false;} return idx<seq.length-1;}
function canForwardSilent(){return !blockReason() && idx<seq.length-1;}

/* ---------- gestures ---------- */
let sx=0,sy=0,dy=0,dragging=false,st=0,scroller=null,axis=null,hscroll=null;
function isField(t){const n=(t.tagName||"").toUpperCase();return n==="TEXTAREA"||n==="INPUT";}
function scrollerAt(t){let e=t;while(e&&e!==track){if(e.classList&&e.classList.contains("card"))return e;e=e.parentElement;}return null;}
function hscrollAt(t){let e=t;while(e&&e!==track){
  if(e.scrollWidth>e.clientWidth+1){const ox=getComputedStyle(e).overflowX;if(ox==="auto"||ox==="scroll")return e;}
  e=e.parentElement;} return null;}
track.addEventListener("touchstart",e=>{
  if(e.touches.length>1)return;
  if(isField(e.target)){dragging=false;return;}          // let the scratchpad behave normally
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;dy=0;dragging=true;st=Date.now();
  axis=null; scroller=scrollerAt(e.target); hscroll=hscrollAt(e.target);
  track.style.transition="none";
},{passive:true});
track.addEventListener("touchmove",e=>{
  if(!dragging)return;
  const dx=e.touches[0].clientX-sx, d=e.touches[0].clientY-sy;
  if(axis===null){
    if(Math.abs(dx)<6&&Math.abs(d)<6)return;
    axis=(hscroll&&Math.abs(dx)>Math.abs(d))?"x":"y";
  }
  if(axis==="x"){dy=0;return;}
  if(scroller){
    const atTop=scroller.scrollTop<=0, atBot=scroller.scrollTop+scroller.clientHeight>=scroller.scrollHeight-1;
    if((d>0&&!atTop)||(d<0&&!atBot))return;
  }
  dy=d;
  let eff=dy;
  if((dy<0&&!canForwardSilent())||(dy>0&&idx===0))eff=dy*0.28;
  track.style.transform=`translate3d(0,${-idx*H+eff}px,0)`;
  if(e.cancelable)e.preventDefault();
},{passive:false});
track.addEventListener("touchend",()=>{
  if(!dragging)return; dragging=false;
  if(axis==="x"){axis=null;dy=0;return;}
  const v=Math.abs(dy)/Math.max(1,Date.now()-st);
  const trip=Math.abs(dy)>H*0.16||v>0.45;
  if(trip&&dy<0){ if(canForward())go(idx+1,true); else go(idx,true); }
  else if(trip&&dy>0){ go(idx-1,true); }
  else go(idx,true);
  dy=0;axis=null;
},{passive:true});

let wlock=0;
window.addEventListener("wheel",e=>{
  if(!player.classList.contains("on"))return;
  if(isField(e.target))return;
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
  const sc=scrollerAt(e.target);
  if(sc){const atTop=sc.scrollTop<=0,atBot=sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1;
    if((e.deltaY<0&&!atTop)||(e.deltaY>0&&!atBot))return;}
  const now=Date.now(); if(now-wlock<420)return;
  if(Math.abs(e.deltaY)<12)return;
  wlock=now;
  if(e.deltaY>0){if(canForward())go(idx+1,true);}else go(idx-1,true);
},{passive:true});
window.addEventListener("keydown",e=>{
  if(!player.classList.contains("on"))return;
  if(isField(document.activeElement))return;             // typing, not navigating
  if(e.key==="ArrowDown"||e.key===" "||e.key==="PageDown"){e.preventDefault();if(canForward())go(idx+1,true);}
  if(e.key==="ArrowUp"||e.key==="PageUp"){e.preventDefault();go(idx-1,true);}
  if(e.key==="Escape")close();
  if(/^[1-6]$/.test(e.key)){
    const s=seq[idx];
    if(s.card.type==="q"&&!s.state&&s.order&&s.order[+e.key-1]!==undefined)answer(idx,s.order[+e.key-1]);
  }
});
window.addEventListener("resize",()=>{if(player.classList.contains("on"))reflow();});
window.addEventListener("orientationchange",()=>setTimeout(reflow,260));
document.addEventListener("gesturestart",e=>e.preventDefault());

renderHome();
</script>
</body>
</html>
