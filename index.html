<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Two-part drill deck for the Meta Business Support Engineer screening interview.">
<title>BSE Prep — Meta Screening</title>
<style>
:root{
  --bg:#0b0d10; --panel:#14181e; --panel2:#1b212a; --line:#252c37;
  --tx:#eef2f7; --dim:#8e9aab; --dim2:#5f6b7c;
  --blue:#3b82f6; --violet:#8b5cf6;
  --ok:#22c55e; --okbg:rgba(34,197,94,.13);
  --no:#ef4444; --nobg:rgba(239,68,68,.13);
  --amber:#f59e0b; --ambbg:rgba(245,158,11,.13);
  --safeT:env(safe-area-inset-top,0px);
  --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);
  font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
code,pre,textarea{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ---------- HOME ---------- */
#home{position:fixed;inset:0;overflow-x:hidden;overflow-y:auto;padding:calc(var(--safeT) + 24px) 18px calc(var(--safeB) + 30px);-webkit-overflow-scrolling:touch}
#home.hide{display:none}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:700}
h1{font-size:28px;line-height:1.15;margin:9px 0 8px;letter-spacing:-.02em;font-weight:750;overflow-wrap:anywhere}
.sub{color:var(--dim);font-size:14.5px;margin:0;overflow-wrap:anywhere}
.seg{display:flex;gap:4px;background:var(--panel2);border-radius:12px;padding:4px;margin:20px 0 6px}
.seg button{flex:1;min-width:0;padding:9px 6px;border-radius:9px;font-size:13.5px;font-weight:640;color:var(--dim);transition:.15s;line-height:1.25}
.seg button.on{background:var(--blue);color:#fff}
.seg small{display:block;font-size:10px;font-weight:500;opacity:.8;margin-top:1px}
.partnote{font-size:12.5px;color:var(--dim2);margin:12px 2px 16px;line-height:1.5;overflow-wrap:anywhere}
.statrow{display:flex;gap:9px;margin:0 0 20px}
.stat{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.stat b{display:block;font-size:20px;line-height:1.1;letter-spacing:-.02em}
.stat span{font-size:10px;color:var(--dim2);text-transform:uppercase;letter-spacing:.06em}
.deck{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;transition:transform .12s,border-color .12s}
.deck:active{transform:scale(.985);border-color:#39445a}
.ring{position:relative;flex:0 0 46px;height:46px}
.ring svg{transform:rotate(-90deg)}
.ring i{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-style:normal;font-weight:700;color:var(--dim)}
.dmeta{flex:1;min-width:0}
.dname{font-weight:650;font-size:15.5px;letter-spacing:-.01em;overflow-wrap:anywhere}
.ddesc{font-size:12.5px;color:var(--dim2);margin-top:2px;white-space:normal;overflow:visible;overflow-wrap:anywhere;line-height:1.4}
.chev{color:var(--dim2);font-size:19px}
.ghost{width:100%;border:1px dashed var(--line);border-radius:14px;padding:13px;color:var(--dim);font-size:13.5px;margin-top:6px}
.ghost:active{background:var(--panel)}
.tip{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;padding:13px 14px;font-size:13px;color:var(--dim);line-height:1.55;overflow-wrap:anywhere}
.tip b{color:var(--tx)}

/* ---------- PLAYER ---------- */
#player{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:50}
#player.on{display:flex}
.topbar{flex:0 0 auto;padding:calc(var(--safeT) + 9px) 14px 9px;display:flex;align-items:center;gap:11px;z-index:20}
.xbtn{width:32px;height:32px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:16px;color:var(--dim);flex:0 0 auto}
.bar{flex:1;height:3px;background:var(--panel2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);border-radius:2px;transition:width .3s cubic-bezier(.4,0,.2,1)}
.count{font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:44px;text-align:right}
.stage{flex:1;position:relative;overflow:hidden}
#track{position:absolute;inset:0;will-change:transform}
.slide{position:absolute;left:0;width:100%;height:100%;padding:2px 14px 14px;display:flex;flex-direction:column;overflow:hidden;min-width:0;max-width:100%}
.card{flex:1;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);
  border-radius:22px;padding:22px 16px calc(var(--safeB) + 20px);
  display:flex;flex-direction:column;overflow-x:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;max-width:100%}
.card::-webkit-scrollbar{width:0}
.tagrow{display:flex;align-items:center;gap:7px;margin-bottom:14px;flex:0 0 auto}
.tag{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:750;padding:4px 8px;border-radius:6px}
.tag.learn{background:rgba(59,130,246,.15);color:#7aa9f7}
.tag.quiz{background:rgba(245,158,11,.15);color:#f0b354}
.tag.again{background:rgba(239,68,68,.15);color:#f08a8a}
.tag.retry{background:rgba(34,197,94,.15);color:#66d68d}
.tag.code{background:rgba(139,92,246,.17);color:#b39bf5}
.tag.sql{background:rgba(59,130,246,.17);color:#7aa9f7}
.tag.speak{background:rgba(34,197,94,.15);color:#66d68d}
h2{font-size:23px;line-height:1.22;margin:0 0 12px;letter-spacing:-.022em;font-weight:700;overflow-wrap:anywhere}
.body{font-size:16.5px;line-height:1.62;color:#d5dde8;margin:0;overflow-wrap:anywhere}
.body b{color:#fff;font-weight:680}
.body code,.qtext code{background:var(--panel2);padding:1.5px 5px;border-radius:5px;font-size:.88em;color:#9dc0f5;word-break:break-word;overflow-wrap:anywhere}
pre{background:#0a0c0f;border:1px solid var(--line);border-radius:12px;padding:12px;margin:15px 0 0;
  display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;
  overflow-x:auto;overflow-y:visible;
  font-size:12.8px;line-height:1.62;color:#cfd8e5;
  white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;tab-size:2}
pre .ln{display:block;max-width:100%;min-width:0;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap}
pre span{overflow-wrap:anywhere;word-break:break-word}
pre .c{color:#5f6b7c;font-style:italic}
pre .s{color:#86c98f}
pre .k{color:#8ab4f8}
pre .n{color:#e0a86a}
.note{margin-top:16px;padding:12px 14px;background:rgba(59,130,246,.07);border-left:2px solid var(--blue);border-radius:0 10px 10px 0;font-size:14px;line-height:1.55;color:#a9bad0;overflow-wrap:anywhere}
.note b{color:#dce6f3}
.qtext{font-size:19.5px;line-height:1.38;font-weight:640;letter-spacing:-.015em;margin:0 0 6px;overflow-wrap:anywhere}
.opts{margin-top:16px;display:flex;flex-direction:column;gap:9px;flex:0 0 auto}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;background:var(--panel2);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;font-size:15px;line-height:1.42;color:#d5dde8;transition:.14s;overflow-wrap:anywhere;min-height:44px}
.opt:active{transform:scale(.99)}
.opt .ltr{flex:0 0 21px;height:21px;border-radius:6px;background:#2b3340;display:grid;place-items:center;font-size:11px;font-weight:750;color:var(--dim);margin-top:1px}
.opt.ok{border-color:var(--ok);background:var(--okbg);color:#e6fbec}
.opt.ok .ltr{background:var(--ok);color:#05230f}
.opt.no{border-color:var(--no);background:var(--nobg);color:#ffe9e9}
.opt.no .ltr{background:var(--no);color:#2b0505}
.opt.dead{opacity:.42}
.verdict{margin-top:16px;border-radius:14px;padding:14px;font-size:14.5px;line-height:1.58;flex:0 0 auto}
.verdict.good{background:var(--okbg);border:1px solid rgba(34,197,94,.3)}
.verdict.bad{background:var(--nobg);border:1px solid rgba(239,68,68,.3)}
.verdict h4{margin:0 0 5px;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.verdict.good h4{color:#66d68d}
.verdict.bad h4{color:#f08a8a}
.verdict p{margin:0;color:#c9d4e2;overflow-wrap:anywhere}

/* ---------- OPEN / TEACH WALKTHROUGH ---------- */
.clar{margin-top:14px;flex:0 0 auto}
.clarbtn{width:100%;text-align:left;background:var(--panel2);border-radius:11px;padding:12px 13px;font-size:13px;color:var(--dim);display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
.clarbody{margin-top:8px;padding:11px 13px;background:rgba(245,158,11,.07);border-left:2px solid var(--amber);border-radius:0 9px 9px 0;font-size:13.5px;line-height:1.6;color:#c6b391;overflow-wrap:anywhere}
.clarbody div{margin-bottom:5px}
.clarbody div:last-child{margin-bottom:0}
.ask{margin-top:8px;padding:12px 14px;background:rgba(245,158,11,.07);border-left:2px solid var(--amber);border-radius:0 10px 10px 0;font-size:14px;line-height:1.55;color:#c6b391;overflow-wrap:anywhere}
.ask div{position:relative;padding-left:16px;margin-bottom:7px}
.ask div:last-child{margin-bottom:0}
.ask div:before{content:"•";position:absolute;left:0;color:var(--amber)}
.saybox{margin-top:14px;padding:13px 15px;background:rgba(34,197,94,.07);border:1px dashed rgba(34,197,94,.35);border-radius:12px;font-size:14px;line-height:1.55;color:#9fd7b3;flex:0 0 auto;overflow-wrap:anywhere}
.mhead{margin-top:20px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim2);font-weight:700;flex:0 0 auto}
.rub{margin-top:9px;padding:12px 14px;background:var(--panel2);border-radius:12px;font-size:13.8px;line-height:1.6;color:#c2ccda;flex:0 0 auto;overflow-wrap:anywhere}
.rub div{padding-left:17px;position:relative;margin-bottom:6px}
.rub div:last-child{margin-bottom:0}
.rub div:before{content:"☐";position:absolute;left:0;color:var(--dim2)}
.fup{margin-top:9px;padding:12px 14px;background:rgba(139,92,246,.08);border-left:2px solid var(--violet);border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.6;color:#b9aede;flex:0 0 auto;overflow-wrap:anywhere}
.fup div{margin-bottom:5px}
.fup div:last-child{margin-bottom:0}
.grade{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px;flex:0 0 auto}
.grade button{flex:1 1 calc(50% - 4px);border-radius:12px;padding:14px 8px;font-size:13px;font-weight:640;background:var(--panel2);color:var(--dim);border:1.5px solid transparent;line-height:1.3;min-height:48px}
.grade button.g1{color:#66d68d}.grade button.g1.sel{background:var(--okbg);border-color:var(--ok)}
.grade button.g2{color:#f0b354}.grade button.g2.sel{background:var(--ambbg);border-color:var(--amber)}
.grade button.g3{color:#f08a8a}.grade button.g3.sel{background:var(--nobg);border-color:var(--no)}
.gradelbl{margin-top:16px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim2);font-weight:700;flex:0 0 auto}

.hintbar{flex:0 0 auto;height:34px;display:grid;place-items:center;font-size:11.5px;color:var(--dim2);letter-spacing:.02em}
.hintbar.pulse{animation:bob 1.7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-4px);opacity:1}}
.done{text-align:center;padding:30px 6px}
.done .big{font-size:52px;font-weight:750;letter-spacing:-.03em;line-height:1}
.done .lbl{color:var(--dim);font-size:14px;margin-top:8px}
.act{margin-top:22px;display:flex;flex-direction:column;gap:9px}
.btn{background:var(--blue);border-radius:13px;padding:14px;font-weight:640;font-size:15px;color:#fff}
.btn.sec{background:var(--panel2);color:var(--tx)}
.btn:active{opacity:.85}
.toast{position:fixed;left:50%;bottom:calc(var(--safeB) + 22px);transform:translateX(-50%) translateY(14px);background:#242c38;border:1px solid var(--line);color:var(--tx);font-size:13.5px;padding:11px 17px;border-radius:11px;opacity:0;pointer-events:none;transition:.22s;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-height:760px){
  .slide{padding:2px 11px 11px}
  .card{padding:17px 16px calc(var(--safeB) + 15px);border-radius:19px}
  .tagrow{margin-bottom:11px}
  h2{font-size:20.5px;margin-bottom:10px}
  .body{font-size:15.2px;line-height:1.55}
  .qtext{font-size:17.5px}
  .opts{gap:7px;margin-top:13px}
  .opt{font-size:14px;padding:11px 12px;border-radius:12px;gap:9px}
  pre{font-size:11.9px;padding:11px;margin-top:12px;line-height:1.55}
  .verdict{font-size:13.4px;padding:12px;margin-top:13px}
  .note{font-size:13px;padding:10px 12px;margin-top:13px}
  .hintbar{height:28px}
}
@media(max-height:640px){
  .card{padding:14px 14px calc(var(--safeB) + 12px)}
  h2{font-size:18.5px;margin-bottom:8px}
  .body{font-size:14.2px;line-height:1.5}
  .qtext{font-size:16px}
  .opt{font-size:13.1px;padding:9px 11px;line-height:1.36}
  pre{font-size:11.1px;padding:9px;margin-top:10px;line-height:1.5}
  .hintbar{height:24px;font-size:10.5px}
}
@media(max-width:480px){
  h1{font-size:24px}
  .seg button{min-height:48px;font-size:13px;padding:10px 4px}
  .stat{padding:10px 8px}
  .stat b{font-size:17px}
  .qtext{font-size:17px}
  .deck{padding:13px 12px;gap:10px}
  .grade button{flex:1 1 100%}
  pre,pre span,pre .ln{word-break:break-all}
}
@media(min-width:720px){
  #home{max-width:600px;margin:0 auto;left:0;right:0}
  .slide{max-width:600px;margin:0 auto;left:0;right:0}
}
</style>
</head>
<body>

<div id="home"></div>

<div id="player">
  <div class="topbar">
    <button class="xbtn" id="back">&#10005;</button>
    <div class="bar"><i id="barfill"></i></div>
    <div class="count" id="count">1/1</div>
  </div>
  <div class="stage"><div id="track"></div></div>
  <div class="hintbar" id="hint">swipe up &#8593;</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* DECK 1 — PYTHON CODING & DEBUGGING */
const DECK_PY = [
{id:"py1",deck:"py",type:"teach",title:"The 30-minute block",body:"Two problems, easy→medium. Coderpad. **Your code will not run.**",note:"So: talk out loud, name your approach before typing, and dry-run your own code at the end."},
{id:"py2",deck:"py",type:"teach",title:"What they actually score",body:"Not clever tricks. They score: did you clarify, did you pick a sane structure, can you state the complexity, did you catch your own bug."},
{id:"py3",deck:"py",type:"teach",title:"Say this in the first 30 seconds",body:"\"Let me restate the problem… what should happen if the input is empty / has duplicates?\"",note:"Clarifying questions are a scored signal, not a delay."},

{id:"py4",deck:"py",type:"teach",title:"list vs dict — the one difference",body:"`list` = ordered, search is O(n).\n`dict` = key→value, lookup is O(1).",code:"nums = [3, 7, 1]        # index by position\nages = {\"ana\": 31}      # index by key"},
{id:"py5",deck:"py",type:"q",q:"`x in my_list` vs `x in my_dict` — cost?",opts:["Both O(1)","list O(n), dict O(1)","list O(1), dict O(n)","Both O(n)"],ans:1,why:"A list must scan every element. A dict hashes the key and jumps straight there.",
 reteach:{title:"Think of it physically",body:"A list is a row of boxes — to find something you open each box.\nA dict is a coat check — you hand over the ticket, they grab it instantly.",code:"# 1,000,000 items:\nx in big_list   # up to 1,000,000 checks\nx in big_dict   # 1 check"},
 retry:{q:"You must check 10,000 IDs against 1,000,000 known IDs. Store the known IDs as…",opts:["a list","a set or dict","a sorted list","a string"],ans:1,why:"Set/dict membership is O(1), so 10,000 checks stay 10,000 operations instead of 10 billion."}},

{id:"py6",deck:"py",type:"teach",title:"dict — the 4 moves",body:"Get with a default, set, loop over pairs.",code:"d = {\"a\": 1}\nd[\"b\"] = 2            # set\nd.get(\"z\", 0)         # 0, no crash\nd[\"z\"]                # KeyError!\nfor k, v in d.items():\n    ...",note:"`.get()` is the one that saves you in interviews."},
{id:"py7",deck:"py",type:"q",q:"What does this print?",code:"d = {\"a\": 1}\nprint(d.get(\"b\", 0) + 5)",opts:["KeyError","5","6","None"],ans:1,why:"`\"b\"` is missing, so `.get` returns the default `0`. 0 + 5 = 5.",
 reteach:{title:"`.get(key, default)` = 'try, else'",body:"Bracket access demands the key exists. `.get` shrugs and hands you the fallback.",code:"d[\"b\"]          # KeyError — crash\nd.get(\"b\")      # None\nd.get(\"b\", 0)   # 0"},
 retry:{q:"Result?",code:"d = {\"a\": 1}\nprint(d.get(\"a\", 99))",opts:["99","1","None","KeyError"],ans:1,why:"The key exists, so the default is ignored and you get the real value, 1."}},

{id:"py8",deck:"py",type:"teach",title:"Pattern 1 — COUNT things",body:"The single most common easy question shape.",code:"counts = {}\nfor w in words:\n    counts[w] = counts.get(w, 0) + 1"},
{id:"py9",deck:"py",type:"q",q:"What is `counts` at the end?",code:"words = [\"a\", \"b\", \"a\"]\ncounts = {}\nfor w in words:\n    counts[w] = counts.get(w, 0) + 1",opts:["{'a': 1, 'b': 1}","{'a': 2, 'b': 1}","{'a': 3}","{'a': 2, 'b': 2}"],ans:1,why:"'a' appears twice, 'b' once.",
 reteach:{title:"Trace it row by row",body:"Walk the loop like a table — this is exactly how you should dry-run in coderpad.",code:"w='a' -> get('a',0)=0 -> counts={'a':1}\nw='b' -> get('b',0)=0 -> counts={'a':1,'b':1}\nw='a' -> get('a',0)=1 -> counts={'a':2,'b':1}"},
 retry:{q:"Final value of `counts['x']`?",code:"counts = {}\nfor w in [\"x\",\"y\",\"x\",\"x\"]:\n    counts[w] = counts.get(w, 0) + 1",opts:["1","2","3","4"],ans:2,why:"'x' appears three times."}},

{id:"py10",deck:"py",type:"teach",title:"The shortcut: Counter",body:"Know the manual loop, then mention this.",code:"from collections import Counter\nc = Counter(words)      # {'a': 2, 'b': 1}\nc.most_common(2)        # top 2 as (item, count)",note:"Say: \"I'd hand-roll it, but in production I'd use Counter.\" That reads as experience."},

{id:"py11",deck:"py",type:"teach",title:"Pattern 2 — GROUP things",body:"Bucket items under a key. Same shape as SQL's GROUP BY.",code:"groups = {}\nfor emp in employees:\n    groups.setdefault(emp[\"dept\"], []).append(emp[\"name\"])"},
{id:"py12",deck:"py",type:"q",q:"Group these by first letter. What is `groups['a']`?",code:"names = [\"ana\", \"bob\", \"amy\"]\ngroups = {}\nfor n in names:\n    groups.setdefault(n[0], []).append(n)",opts:["'ana'","['ana']","['ana', 'amy']","['ana', 'bob', 'amy']"],ans:2,why:"Both 'ana' and 'amy' start with 'a', so both land in the same list.",
 reteach:{title:"`setdefault` = 'make the bucket if missing'",body:"It returns the existing list, or creates an empty one first. Then you append to it.",code:"# equivalent long form:\nif n[0] not in groups:\n    groups[n[0]] = []\ngroups[n[0]].append(n)"},
 retry:{q:"What is `groups` after the loop?",code:"groups = {}\nfor n in [\"cat\", \"cow\"]:\n    groups.setdefault(n[0], []).append(n)",opts:["{'c': ['cat','cow']}","{'c': 'cow'}","{'cat':[], 'cow':[]}","{'c': ['cat'], 'o': ['cow']}"],ans:0,why:"Both start with 'c', so one bucket holds both."}},
{id:"py13",deck:"py",type:"teach",title:"defaultdict — same thing, cleaner",body:"",code:"from collections import defaultdict\ngroups = defaultdict(list)\nfor emp in employees:\n    groups[emp[\"dept\"]].append(emp[\"name\"])"},

{id:"py14",deck:"py",type:"teach",title:"set — dedupe & fast membership",body:"Unordered, no duplicates, O(1) lookup.",code:"seen = set()\nseen.add(5)\n5 in seen            # True\nlist(set([1,1,2]))   # [1, 2]\nset(a) & set(b)      # items in both\nset(a) - set(b)      # in a, not in b"},
{id:"py15",deck:"py",type:"q",q:"`len(set([1, 2, 2, 3, 3, 3]))` is…",opts:["6","3","1","2"],ans:1,why:"A set keeps only unique values: {1, 2, 3}.",
 reteach:{title:"A set is a guest list",body:"Writing the same name twice doesn't add a second guest.",code:"set([1,2,2,3,3,3])  ->  {1, 2, 3}\nlen(...)            ->  3"},
 retry:{q:"`set(\"hello\")` has how many elements?",opts:["5","4","3","2"],ans:1,why:"h, e, l, o — the second 'l' collapses. 4."}},

{id:"py16",deck:"py",type:"teach",title:"Big-O in one card",body:"O(1) instant · O(log n) halving · O(n) one pass · O(n log n) sorting · O(n²) nested loops",note:"State the complexity of your solution *unprompted*. It's a free scoring signal."},
{id:"py17",deck:"py",type:"q",q:"Complexity of this?",code:"for a in items:        # n\n    for b in items:    # n\n        if a == b: ...",opts:["O(n)","O(n log n)","O(n²)","O(1)"],ans:2,why:"A loop of n inside a loop of n = n × n operations.",
 reteach:{title:"Count the nesting",body:"Multiply the loop lengths. One loop over n = O(n). Two nested = O(n × n) = O(n²).",code:"n = 1,000\nsingle loop  ->     1,000 steps\nnested loop  -> 1,000,000 steps"},
 retry:{q:"You replace the inner loop with a set lookup. New complexity?",code:"s = set(items)\nfor a in items:\n    if a in s: ...",opts:["O(n²)","O(n)","O(log n)","O(1)"],ans:1,why:"One pass over n, and each lookup is O(1). That's the classic n² → n rewrite."}},
{id:"py18",deck:"py",type:"teach",title:"Cost cheat sheet",body:"list append O(1) · list `in` O(n) · list insert(0,x) O(n)\ndict/set get, add, `in` O(1)\nsorted() O(n log n)"},

{id:"py19",deck:"py",type:"teach",title:"Strings — the 5 you need",body:"",code:"s.split()          # by whitespace -> list\ns.split(\",\")       # by comma\ns.strip()          # trim whitespace\ns.lower()          # normalise before comparing\n\",\".join(parts)    # list -> string"},
{id:"py20",deck:"py",type:"q",q:"Real Meta-style prompt: for each string, take the 2nd letter of the first word. Output?",code:"data = [\"hello world\", \"hey there\"]\nout = [s.split()[0][1] for s in data]",opts:["['h','h']","['e','e']","['w','t']","['ello','ey']"],ans:1,why:"`split()[0]` grabs the first word; `[1]` grabs index 1 — the second character. 'hello'→'e', 'hey'→'e'.",
 reteach:{title:"Peel it one layer at a time",body:"Always decompose a chained expression left to right when reading code aloud.",code:"s          = \"hello world\"\ns.split()  = [\"hello\", \"world\"]\n     [0]   = \"hello\"\n     [1]   = \"e\"      # index 1 = 2nd char"},
 retry:{q:"Output?",code:"s = \"data eng\"\nprint(s.split()[1][0])",opts:["'d'","'a'","'e'","'eng'"],ans:2,why:"split()[1] = 'eng', then [0] = 'e'."}},

{id:"py21",deck:"py",type:"teach",title:"Slicing",body:"`s[start:end]` — end is excluded.",code:"s = \"abcdef\"\ns[0:3]   # 'abc'\ns[2:]    # 'cdef'\ns[-1]    # 'f'   last\ns[::-1]  # 'fedcba'  reversed"},
{id:"py22",deck:"py",type:"q",q:"`\"support\"[1:4]` is…",opts:["'upp'","'uppo'","'sup'","'ppo'"],ans:0,why:"Start at index 1 ('u'), stop *before* index 4. Characters 1,2,3 = 'upp'.",
 reteach:{title:"The end index is a wall, not an item",body:"Slice length = end − start. Here 4 − 1 = 3 characters.",code:"s u p p o r t\n0 1 2 3 4 5 6\n  ^-----^\n  [1:4] takes 1,2,3"},
 retry:{q:"`\"metaverse\"[0:4]` is…",opts:["'met'","'meta'","'metav'","'etav'"],ans:1,why:"4 − 0 = 4 characters: m,e,t,a."}},

{id:"py23",deck:"py",type:"teach",title:"enumerate & zip",body:"",code:"for i, v in enumerate(items):    # index + value\n    ...\nfor name, score in zip(names, scores):   # pair two lists\n    ..."},
{id:"py24",deck:"py",type:"q",q:"What does `dict(zip([\"a\",\"b\"], [1,2,3]))` give?",opts:["{'a':1,'b':2,'c':3}","{'a':1,'b':2}","Error — lengths differ","{'a':[1,2],'b':[3]}"],ans:1,why:"`zip` stops at the shorter list. The extra 3 is silently dropped.",
 reteach:{title:"zip is a zipper — it stops at the shorter side",body:"No error, no warning. Silent truncation is a classic source of data bugs.",code:"zip([\"a\",\"b\"], [1,2,3])\n  -> ('a',1), ('b',2)      # 3 dropped"},
 retry:{q:"`len(list(zip([1,2,3,4], [\"x\",\"y\"])))` is…",opts:["4","3","2","6"],ans:2,why:"Shorter list has 2 items, so you get 2 pairs."}},

{id:"py25",deck:"py",type:"teach",title:"Sorting with a key",body:"",code:"sorted(nums)                         # ascending\nsorted(nums, reverse=True)           # descending\nsorted(people, key=lambda p: p[\"age\"])\nsorted(d.items(), key=lambda kv: kv[1], reverse=True)  # dict by value"},
{id:"py26",deck:"py",type:"q",q:"Top 2 most frequent words. Which line is right?",code:"counts = {\"a\": 5, \"b\": 9, \"c\": 2}",opts:["sorted(counts)[:2]","sorted(counts.items(), key=lambda kv: kv[1], reverse=True)[:2]","sorted(counts.values())[:2]","counts.sort()[:2]"],ans:1,why:"You need to sort the (key, value) pairs by the value, descending, then slice 2.",
 reteach:{title:"Three things must all be right",body:"1. `.items()` so you keep the word\n2. `key=lambda kv: kv[1]` so you sort by count, not by word\n3. `reverse=True` for *most* frequent",code:"sorted(counts.items(),\n       key=lambda kv: kv[1],\n       reverse=True)[:2]\n# [('b', 9), ('a', 5)]"},
 retry:{q:"Which gives the word with the LOWEST count?",code:"counts = {\"a\": 5, \"b\": 9, \"c\": 2}",opts:["min(counts)","min(counts, key=counts.get)","min(counts.values())","sorted(counts)[0]"],ans:1,why:"`min(counts, key=counts.get)` compares by value but returns the key → 'c'. Option 3 returns 2, the count, not the word."}},

{id:"py27",deck:"py",type:"teach",title:"List comprehension",body:"Filter and transform in one line.",code:"[x * 2 for x in nums]\n[x for x in nums if x > 0]\n[x*2 for x in nums if x > 0]"},
{id:"py28",deck:"py",type:"q",q:"Output?",code:"nums = [1, 2, 3, 4]\nprint([n for n in nums if n % 2 == 0])",opts:["[1, 3]","[2, 4]","[1, 2, 3, 4]","[True, False]"],ans:1,why:"`n % 2 == 0` keeps even numbers.",
 reteach:{title:"Read it right-to-left",body:"`for n in nums` = the source. `if …` = the filter. The bit at the front = what you keep.",code:"[  n          for n in nums   if n % 2 == 0  ]\n   ^keep this  ^source          ^filter"},
 retry:{q:"Output?",code:"print([w.upper() for w in [\"a\",\"bb\",\"c\"] if len(w) == 1])",opts:["['A','BB','C']","['A','C']","['a','c']","['BB']"],ans:1,why:"Filter keeps 1-char words, then uppercases them."}},

{id:"py29",deck:"py",type:"teach",title:"Files & exceptions",body:"A very common 'practical' prompt.",code:"try:\n    with open(\"data.csv\") as f:\n        for line in f:\n            parts = line.strip().split(\",\")\nexcept FileNotFoundError:\n    print(\"missing file\")",note:"`with` closes the file for you. Mention that."},
{id:"py30",deck:"py",type:"q",q:"You must not crash on a missing file OR a bad row. Best structure?",opts:["One big try/except Exception around everything","try/except FileNotFoundError on the open, and a narrow try/except inside the loop for parsing","No try/except — validate first","except: pass"],ans:1,why:"Catch specific errors at the level where you can actually recover. A bad row should skip that row, not kill the whole file.",
 reteach:{title:"Catch narrow, catch close",body:"Bare `except:` hides real bugs. Wrapping everything means one bad row loses the whole file.",code:"try:\n    with open(p) as f:\n        for i, line in enumerate(f):\n            try:\n                parse(line)\n            except ValueError:\n                bad.append(i)   # skip, keep going\nexcept FileNotFoundError:\n    ..."},
 retry:{q:"Why is bare `except: pass` a red flag in an interview?",opts:["It's slower","It swallows every error including typos and KeyboardInterrupt, hiding bugs","It's not valid Python","It only catches ValueError"],ans:1,why:"It silently hides real failures — the opposite of what a support engineer wants."}},

{id:"py31",deck:"py",type:"teach",title:"Pattern 3 — two-sum / seen-map",body:"Whenever a question says \"find a pair that…\", reach for a hash map.",code:"def two_sum(nums, target):\n    seen = {}\n    for i, n in enumerate(nums):\n        if target - n in seen:\n            return [seen[target - n], i]\n        seen[n] = i",note:"O(n) instead of the O(n²) double loop."},
{id:"py32",deck:"py",type:"q",q:"`two_sum([2, 7, 11], 9)` returns…",opts:["[2, 7]","[0, 1]","[1, 0]","None"],ans:1,why:"It returns *indices*. 2 is at index 0, 7 at index 1.",
 reteach:{title:"Walk the loop",body:"The map stores value → index of everything already seen.",code:"i=0 n=2: need 7, not seen -> seen={2:0}\ni=1 n=7: need 2, IS in seen -> return [seen[2], 1]\n                            -> [0, 1]"},
 retry:{q:"What's stored in `seen` — and why does that matter?",opts:["index → value","value → index, so we can return the position of the earlier number","value → count","nothing, it's a set"],ans:1,why:"You look up by the *value you need* and get back where it was."}},

{id:"py33",deck:"py",type:"teach",title:"Pattern 4 — sliding window",body:"For \"longest / max sum of a contiguous run\".",code:"best = cur = 0\nfor n in nums:\n    cur = max(n, cur + n)\n    best = max(best, cur)"},
{id:"py34",deck:"py",type:"teach",title:"Pattern 5 — anagram / same-contents",body:"Two things are the same multiset?",code:"Counter(a) == Counter(b)\n# or\nsorted(a) == sorted(b)   # O(n log n)"},

{id:"py35",deck:"py",type:"teach",title:"— Debugging block —",body:"Half the coding round can be \"here's broken code, what's wrong?\" The next cards are the bugs they actually use."},
{id:"py36",deck:"py",type:"q",q:"BUG: what does the second call print?",code:"def add(item, bag=[]):\n    bag.append(item)\n    return bag\n\nprint(add(1))\nprint(add(2))",opts:["[1] then [2]","[1] then [1, 2]","[1] then []","TypeError"],ans:1,why:"The default list is created **once**, at function definition, and reused forever. Classic Python gotcha.",
 reteach:{title:"Mutable default argument",body:"`bag=[]` is evaluated once when Python reads the `def` — not on each call. Every call shares the same list.",code:"def add(item, bag=None):   # the fix\n    if bag is None:\n        bag = []\n    bag.append(item)\n    return bag"},
 retry:{q:"Which default is safe to write directly?",opts:["def f(x=[])","def f(x={})","def f(x=0)","def f(x=set())"],ans:2,why:"Ints/strings/tuples are immutable, so sharing them is harmless. Lists, dicts and sets are not."}},

{id:"py37",deck:"py",type:"q",q:"BUG: what's left in `nums`?",code:"nums = [1, 2, 3, 4]\nfor n in nums:\n    if n % 2 == 0:\n        nums.remove(n)\nprint(nums)",opts:["[1, 3]","[1, 3, 4]","[]","[1, 2, 3, 4]"],ans:1,why:"Removing while iterating shifts the indices — the loop skips 4 entirely.",
 reteach:{title:"Never mutate what you're looping over",body:"Removing 2 slides 3 into position 1, but the loop moves on to position 2 — so it never inspects 3's old slot and misses 4.",code:"# fix: build a new list\nnums = [n for n in nums if n % 2 != 0]\n# or iterate a copy\nfor n in nums[:]:\n    ..."},
 retry:{q:"Safest fix for 'remove all even numbers'?",opts:["for n in nums: nums.remove(n)","nums = [n for n in nums if n % 2]","while nums: nums.pop()","nums.clear()"],ans:1,why:"Build a new list from a filter — no mutation during iteration."}},

{id:"py38",deck:"py",type:"q",q:"BUG: `b` changed too. Why?",code:"a = [[0, 0], [0, 0]]\nb = a.copy()\nb[0][0] = 9\nprint(a[0][0])",opts:["0","9","None","Error"],ans:1,why:"`.copy()` is *shallow* — the outer list is new but the inner lists are the same objects.",
 reteach:{title:"Shallow vs deep copy",body:"A shallow copy duplicates the box, not what's inside the box.",code:"import copy\nb = copy.deepcopy(a)   # truly independent"},
 retry:{q:"`a = [1,2]; b = a; b.append(3); len(a)` is…",opts:["2","3","1","Error"],ans:1,why:"`b = a` doesn't copy at all — both names point to the same list."}},

{id:"py39",deck:"py",type:"q",q:"BUG: this is False. Why?",code:"a = 1000\nb = 1000\nprint(a is b)",opts:["`is` compares identity (same object), not value — use ==","1000 isn't an int","Python bug","It's actually True always"],ans:0,why:"`is` asks 'same object in memory?'. `==` asks 'same value?'. Small ints are cached so it looks true sometimes — which is what makes this a nasty bug.",
 reteach:{title:"`is` vs `==`",body:"Only use `is` for `None`, `True`, `False`.",code:"if x is None:      # correct\nif x == None:      # works but unidiomatic\nif name is \"ana\":  # BUG — use =="},
 retry:{q:"Correct way to check a variable is empty-or-missing?",opts:["if x is None:","if x is \"\":","if x is 0:","if x is []:"],ans:0,why:"`is` is only reliable for the singletons None/True/False."}},

{id:"py40",deck:"py",type:"q",q:"BUG: rate is always 0. Why?",code:"success = 7\ntotal = 10\nrate = success // total * 100\nprint(rate)",opts:["`//` is floor division: 7//10 = 0, then 0*100 = 0","total is a string","Missing float()","Operator precedence on *"],ans:0,why:"`//` truncates to 0 before the multiply. Use `/`, or multiply first.",
 reteach:{title:"Integer vs float division",body:"`/` always gives a float. `//` floors.",code:"7 // 10       # 0\n7 / 10        # 0.7\nsuccess / total * 100     # 70.0"},
 retry:{q:"`print(9 // 2, 9 / 2, 9 % 2)` prints…",opts:["4 4.5 1","4.5 4.5 1","4 4.5 0","4 4 1"],ans:0,why:"Floor, true division, remainder."}},

{id:"py41",deck:"py",type:"q",q:"Off-by-one: how many times does this loop run?",code:"for i in range(1, 5):\n    print(i)",opts:["5","4","3","6"],ans:1,why:"`range(1,5)` = 1,2,3,4. The stop value is excluded.",
 reteach:{title:"range excludes the stop",body:"Count = stop − start.",code:"range(5)      # 0,1,2,3,4   (5 items)\nrange(1,5)    # 1,2,3,4     (4 items)\nrange(0,10,2) # 0,2,4,6,8   (5 items)"},
 retry:{q:"`len(list(range(2, 10, 3)))` is…",opts:["2","3","4","8"],ans:1,why:"2, 5, 8 — three values (11 would exceed the stop)."}},

{id:"py42",deck:"py",type:"teach",title:"Debugging out loud — the script",body:"1 Reproduce · 2 Isolate (which layer?) · 3 Read the error/logs · 4 Form one hypothesis · 5 Test it · 6 Fix + prevent",note:"For a *scenario* question with no code, say these six steps. That's the answer they want."},
{id:"py43",deck:"py",type:"q",q:"\"A partner says our API 'stopped working'.\" Best first move?",opts:["Restart the service","Ask for a concrete failing request: timestamp, endpoint, request ID, exact error, and whether it's 100% or intermittent","Check if their token expired","Roll back the last deploy"],ans:1,why:"You can't debug an adjective. Narrowing 'stopped working' into a reproducible case is step one — and it's what separates a support engineer from a guesser.",
 reteach:{title:"Scope before cause",body:"Before *why*, establish *what and how much*:\n• One partner or all? • One endpoint or all? • Started when? • 100% or intermittent? • Any change on either side?",code:"Then: is it client-side (4xx) or server-side (5xx)?\n4xx -> their request. 5xx -> our system."},
 retry:{q:"Same outage, but it's every partner and started 10 minutes ago. Most likely?",opts:["Each partner's token expired at once","A change on our side — recent deploy, config push, or a dependency failing","Their networks all broke","Bad phone numbers"],ans:1,why:"Correlated timing across independent partners points at a shared cause on your side. Check deploys and dependency dashboards first."}},

{id:"py44",deck:"py",type:"teach",title:"Coderpad survival kit",body:"Code doesn't execute. So:\n• Write a comment with your approach *first*\n• Use real variable names\n• At the end, dry-run one small example out loud",note:"Saying \"let me trace this with ['a','b','a']\" catches your own bug before they do. Huge signal."},
{id:"py45",deck:"py",type:"teach",title:"If you get stuck",body:"Say: \"The brute force is O(n²) — let me get that down, then optimise.\"\nA working slow answer beats a broken clever one.",note:"And if they hint — take the hint immediately. The guide literally says: run with it."}
];

/* DECK 2 — SQL */
const DECK_SQL = [
{id:"sq1",deck:"sql",type:"teach",title:"The 20-minute data block",body:"You'll query, filter and aggregate. Roughly 3 correct answers is the bar.",note:"You picked SQL. Say so up front: \"I'll use SQL.\" Don't hedge."},
{id:"sq2",deck:"sql",type:"teach",title:"Say this before writing any query",body:"\"Can I confirm the schema and grain — is one row one order, or one order line?\"",note:"Grain is *the* clarifying question in data interviews."},

{id:"sq3",deck:"sql",type:"teach",title:"The skeleton",body:"Every query is this shape.",code:"SELECT   col, COUNT(*)\nFROM     table\nWHERE    condition\nGROUP BY col\nHAVING   COUNT(*) > 5\nORDER BY 2 DESC\nLIMIT    10;"},
{id:"sq4",deck:"sql",type:"teach",title:"Order of EXECUTION ≠ order you write it",body:"FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT",note:"This one fact explains most SQL confusion. Memorise it."},
{id:"sq5",deck:"sql",type:"q",q:"Why does this fail?",code:"SELECT price * qty AS revenue\nFROM orders\nWHERE revenue > 100;",opts:["Missing GROUP BY","WHERE runs before SELECT, so the alias `revenue` doesn't exist yet","You can't multiply columns","Needs a semicolon"],ans:1,why:"WHERE is evaluated before SELECT creates the alias. Repeat the expression, or wrap it in a subquery/CTE.",
 reteach:{title:"Aliases are born in SELECT",body:"So only clauses that run *after* SELECT can see them — that's ORDER BY (and HAVING in some engines).",code:"-- works:\nWHERE price * qty > 100\n\n-- also works:\nSELECT price*qty AS revenue FROM orders\nORDER BY revenue DESC;   -- ORDER BY runs last"},
 retry:{q:"Which clause CAN use a SELECT alias?",opts:["WHERE","GROUP BY","ORDER BY","FROM"],ans:2,why:"ORDER BY runs after SELECT, so the alias already exists."}},

{id:"sq6",deck:"sql",type:"teach",title:"NULL is not a value",body:"NULL means unknown. Comparing to it gives NULL, never TRUE.",code:"WHERE col = NULL      -- never matches anything\nWHERE col IS NULL     -- correct\nWHERE col IS NOT NULL\nCOALESCE(col, 0)      -- replace NULL with 0"},
{id:"sq7",deck:"sql",type:"q",q:"Table has 10 rows; 3 have `status = 'open'`, 2 have `status = NULL`. How many rows does `WHERE status != 'open'` return?",opts:["7","5","3","2"],ans:1,why:"The 2 NULLs are excluded — `NULL != 'open'` evaluates to NULL, not TRUE. You get 10 − 3 − 2 = 5.",
 reteach:{title:"NULL silently drops rows",body:"This is the #1 real-world data bug and a favourite interview trap.",code:"-- to include the NULLs:\nWHERE status != 'open' OR status IS NULL\n-- or\nWHERE COALESCE(status,'') != 'open'"},
 retry:{q:"`WHERE country NOT IN ('US', NULL)` returns…",opts:["all non-US rows","no rows at all","only NULL rows","only US rows"],ans:1,why:"NOT IN with a NULL in the list makes the whole condition NULL for every row. Nothing comes back. Nasty."}},

{id:"sq8",deck:"sql",type:"teach",title:"COUNT — three different things",body:"",code:"COUNT(*)              -- rows, NULLs included\nCOUNT(col)            -- rows where col IS NOT NULL\nCOUNT(DISTINCT col)   -- unique non-null values"},
{id:"sq9",deck:"sql",type:"q",q:"Column `email` has 100 rows: 20 are NULL, and among the rest only 50 are unique. `COUNT(*)`, `COUNT(email)`, `COUNT(DISTINCT email)`?",opts:["100, 100, 100","100, 80, 50","80, 80, 50","100, 80, 80"],ans:1,why:"`*` counts rows (100). `COUNT(email)` skips NULLs (80). DISTINCT counts unique non-nulls (50).",
 reteach:{title:"Three questions, three counts",body:"• How many rows? → COUNT(*)\n• How many have a value? → COUNT(col)\n• How many different values? → COUNT(DISTINCT col)",code:"SELECT COUNT(*)                AS rows,\n       COUNT(email)            AS with_email,\n       COUNT(DISTINCT email)   AS unique_emails\nFROM users;"},
 retry:{q:"\"How many customers placed an order?\" — from an `orders` table with one row per order:",opts:["COUNT(*)","COUNT(customer_id)","COUNT(DISTINCT customer_id)","SUM(customer_id)"],ans:2,why:"A customer can place many orders. You want unique customers."}},

{id:"sq10",deck:"sql",type:"teach",title:"GROUP BY — the rule",body:"Every column in SELECT must be either in GROUP BY, or inside an aggregate.",code:"SELECT dept, COUNT(*), AVG(salary)\nFROM employees\nGROUP BY dept;"},
{id:"sq11",deck:"sql",type:"q",q:"What's wrong here?",code:"SELECT dept, name, COUNT(*)\nFROM employees\nGROUP BY dept;",opts:["Nothing","`name` is neither grouped nor aggregated — which name would it show?","COUNT(*) needs a column","Missing ORDER BY"],ans:1,why:"A dept groups many names into one row. The engine can't pick one, so it errors (Postgres) or returns a random one (old MySQL).",
 reteach:{title:"One output row per group",body:"If a column varies inside the group, you must tell SQL how to collapse it: MIN, MAX, COUNT, STRING_AGG…",code:"SELECT dept,\n       COUNT(*)         AS headcount,\n       MAX(salary)      AS top_salary\nFROM employees\nGROUP BY dept;"},
 retry:{q:"You want dept plus the highest-paid salary per dept. Correct?",opts:["SELECT dept, salary FROM e GROUP BY dept","SELECT dept, MAX(salary) FROM e GROUP BY dept","SELECT dept, MAX(salary) FROM e","SELECT MAX(dept), salary FROM e"],ans:1,why:"Group by dept, aggregate the salary."}},

{id:"sq12",deck:"sql",type:"teach",title:"WHERE vs HAVING",body:"WHERE filters **rows** (before grouping).\nHAVING filters **groups** (after aggregating).",code:"SELECT dept, COUNT(*)\nFROM employees\nWHERE  active = true      -- drop inactive people\nGROUP BY dept\nHAVING COUNT(*) > 5;      -- drop small depts"},
{id:"sq13",deck:"sql",type:"q",q:"\"Customers with more than 3 orders in 2026.\" Where does each condition go?",opts:["Both in WHERE","Both in HAVING","year in WHERE, count in HAVING","year in HAVING, count in WHERE"],ans:2,why:"The year filters individual order rows → WHERE. The count is an aggregate over the group → HAVING.",
 reteach:{title:"Ask: is this about one row, or the whole group?",body:"One row → WHERE. A COUNT/SUM/AVG → HAVING.",code:"SELECT customer_id, COUNT(*) AS n\nFROM orders\nWHERE order_date >= '2026-01-01'\nGROUP BY customer_id\nHAVING COUNT(*) > 3;"},
 retry:{q:"Putting `COUNT(*) > 3` in WHERE would…",opts:["work fine","error — aggregates aren't allowed in WHERE, it runs before grouping","be faster","count NULLs"],ans:1,why:"WHERE executes before GROUP BY, so no aggregate exists yet."}},

{id:"sq14",deck:"sql",type:"teach",title:"INNER JOIN",body:"Keeps only rows that match on both sides.",code:"SELECT u.name, o.total\nFROM users u\nJOIN orders o ON o.user_id = u.id;",note:"Users with no orders disappear."},
{id:"sq15",deck:"sql",type:"teach",title:"LEFT JOIN",body:"Keeps **all** left rows. Unmatched right columns come back NULL.",code:"SELECT u.name, o.total\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.id;",note:"Users with no orders appear with total = NULL."},
{id:"sq16",deck:"sql",type:"q",q:"100 users, 40 of them have orders (250 orders total). Rows from a LEFT JOIN users→orders?",opts:["100","250","310","40"],ans:2,why:"250 matched rows + 60 unmatched users with NULLs = 310.",
 reteach:{title:"LEFT JOIN isn't 'one row per left row'",body:"Matched left rows are *duplicated* once per match. Unmatched left rows appear exactly once.",code:"250  (matched order rows)\n+ 60  (users with zero orders)\n= 310"},
 retry:{q:"Same data, INNER JOIN instead. How many rows?",opts:["310","250","100","60"],ans:1,why:"Only the matches survive — the 60 order-less users are dropped."}},

{id:"sq17",deck:"sql",type:"teach",title:"Anti-join — 'find the ones with none'",body:"LEFT JOIN then keep the NULLs.",code:"SELECT u.id\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.id\nWHERE o.id IS NULL;   -- users who never ordered",note:"Memorise this shape. It's asked constantly."},
{id:"sq18",deck:"sql",type:"q",q:"THE classic trap. What does this actually return?",code:"SELECT u.id\nFROM users u\nLEFT JOIN orders o ON o.user_id = u.id\nWHERE o.status = 'paid';",opts:["All users, with paid orders where they exist","Only users who have a paid order — the WHERE silently turns it into an INNER JOIN","An error","Users with no orders"],ans:1,why:"For unmatched users, `o.status` is NULL, and `NULL = 'paid'` isn't TRUE — so those rows get filtered out again.",
 reteach:{title:"Filter the right table in the ON clause",body:"Conditions on the right table belong in ON. Conditions on the left table belong in WHERE.",code:"LEFT JOIN orders o\n  ON o.user_id = u.id\n AND o.status = 'paid'    -- <- here\n-- now users with no paid order still appear"},
 retry:{q:"You want every user plus their 2026 order count, including zeros. Where does the date filter go?",opts:["WHERE o.date >= '2026-01-01'","In the ON clause of the LEFT JOIN","In HAVING","In GROUP BY"],ans:1,why:"In WHERE it would drop the zero-order users. In ON it just limits what counts as a match."}},

{id:"sq19",deck:"sql",type:"teach",title:"Fan-out — the silent wrong answer",body:"Joining to a table with multiple matches multiplies rows — and inflates your SUMs.",code:"-- 1 order, 3 items -> 3 rows -> order total counted 3x\nSELECT SUM(o.total)          -- WRONG\nSELECT SUM(DISTINCT ...)     -- fragile\n-- Right: aggregate items first, then join"},
{id:"sq20",deck:"sql",type:"q",q:"Revenue looks 3× too high after adding a join to `order_items`. Cause?",opts:["Wrong currency","Row fan-out — each order now repeats once per item, so its total is summed multiple times","NULLs","Missing GROUP BY"],ans:1,why:"Classic. Pre-aggregate the child table in a CTE, then join one row per order.",
 reteach:{title:"Aggregate first, then join",body:"",code:"WITH item_counts AS (\n  SELECT order_id, COUNT(*) AS n_items\n  FROM order_items GROUP BY order_id\n)\nSELECT SUM(o.total)\nFROM orders o\nJOIN item_counts ic ON ic.order_id = o.id;"},
 retry:{q:"Quick sanity check that a join didn't fan out?",opts:["Compare row count before and after the join","Add DISTINCT everywhere","Use LEFT JOIN","Add ORDER BY"],ans:0,why:"If the row count grew, the join isn't one-to-one. Say this out loud in the interview — it reads as real experience."}},

{id:"sq21",deck:"sql",type:"teach",title:"CASE WHEN",body:"An if-statement inside a query.",code:"SELECT name,\n  CASE WHEN salary > 100000 THEN 'high'\n       WHEN salary > 50000  THEN 'mid'\n       ELSE 'low' END AS band\nFROM employees;"},
{id:"sq22",deck:"sql",type:"teach",title:"The rate / percentage pattern",body:"Conditional aggregation — worth memorising cold.",code:"SELECT\n  COUNT(*)                                        AS total,\n  SUM(CASE WHEN status='resolved' THEN 1 ELSE 0 END) AS resolved,\n  AVG(CASE WHEN status='resolved' THEN 1.0 ELSE 0 END) AS resolve_rate\nFROM tickets;"},
{id:"sq23",deck:"sql",type:"q",q:"Percentage of orders that were refunded, per region. Which SELECT is right?",opts:["COUNT(refunded) / COUNT(*)","AVG(CASE WHEN refunded THEN 1.0 ELSE 0 END) * 100","SUM(refunded) / SUM(*)","COUNT(*) WHERE refunded"],ans:1,why:"`AVG` of a 1/0 flag *is* the rate. The `1.0` forces float division.",
 reteach:{title:"Two traps in one",body:"1. `COUNT(refunded)` counts non-NULLs, not TRUEs.\n2. Integer division truncates to 0 — use 1.0.",code:"SELECT region,\n  100.0 * SUM(CASE WHEN refunded THEN 1 ELSE 0 END)\n        / COUNT(*)  AS pct_refunded\nFROM orders\nGROUP BY region;"},
 retry:{q:"`SUM(x)/COUNT(*)` returns 0 for every row. Most likely cause?",opts:["All x are NULL","Integer division — cast one side to a float/decimal","Missing GROUP BY","Wrong table"],ans:1,why:"Same bug as Python's `//`. Multiply by 1.0 or CAST."}},

{id:"sq24",deck:"sql",type:"teach",title:"Subquery vs CTE",body:"Same power. CTE is readable — use it and say why.",code:"WITH big_spenders AS (\n  SELECT user_id, SUM(total) AS spend\n  FROM orders GROUP BY user_id\n  HAVING SUM(total) > 1000\n)\nSELECT u.name, b.spend\nFROM users u JOIN big_spenders b ON b.user_id = u.id;"},
{id:"sq25",deck:"sql",type:"q",q:"Why prefer a CTE over a nested subquery in an interview?",opts:["It's faster","It reads top-to-bottom, is easy to name, and lets you talk the interviewer through your steps","Subqueries don't support JOIN","CTEs use less memory"],ans:1,why:"The round scores communication as much as correctness. A named CTE narrates your logic for you.",
 reteach:{title:"Structure = communication",body:"Break a hard question into 2–3 named CTEs, then a short final SELECT. Then read the names aloud: \"first I get daily actives, then I join to yesterday's…\"",code:"WITH daily AS (...),\n     ranked AS (...)\nSELECT ... FROM ranked WHERE rn = 1;"},
 retry:{q:"Best first move on a multi-part data question?",opts:["Write one giant query","Say the steps out loud, then build one CTE per step","Ask for the answer","Use SELECT *"],ans:1,why:"Decompose, narrate, build."}},

{id:"sq26",deck:"sql",type:"teach",title:"Self-join",body:"Join a table to itself to compare rows to each other.",code:"-- pairs of employees in the same dept\nSELECT a.name, b.name\nFROM employees a\nJOIN employees b\n  ON a.dept = b.dept\n AND a.id < b.id;   -- avoids dupes & self-pairs"},
{id:"sq27",deck:"sql",type:"q",q:"Real Meta-style prompt: \"count people who checked out a book on the same day another person returned one.\" Key join condition?",opts:["a.book_id = b.book_id","a.checkout_date = b.return_date AND a.user_id != b.user_id","a.user_id = b.user_id","a.id = b.id"],ans:1,why:"Match checkout date to return date, and exclude the same person.",
 reteach:{title:"Self-join checklist",body:"1. Alias both copies (a, b)\n2. Join on the *relationship*, not the id\n3. Exclude the row matching itself\n4. COUNT(DISTINCT …) to avoid double counting",code:"SELECT COUNT(DISTINCT a.user_id)\nFROM loans a\nJOIN loans b\n  ON a.checkout_date = b.return_date\n AND a.user_id <> b.user_id;"},
 retry:{q:"Without `a.user_id <> b.user_id`, what goes wrong?",opts:["Nothing","Someone who returned and checked out on the same day matches themselves, inflating the count","It errors","It returns zero rows"],ans:1,why:"Always ask yourself whether a row can match itself."}},

{id:"sq28",deck:"sql",type:"teach",title:"Window functions — the idea",body:"Aggregate **without collapsing rows**. You keep every row and get a computed extra column.",code:"SELECT name, dept, salary,\n       AVG(salary) OVER (PARTITION BY dept) AS dept_avg\nFROM employees;",note:"GROUP BY squashes rows. OVER() does not. That's the whole distinction."},
{id:"sq29",deck:"sql",type:"q",q:"You need each employee's salary AND their dept average on the same row. Which?",opts:["GROUP BY dept","AVG(salary) OVER (PARTITION BY dept)","HAVING AVG(salary)","COUNT(*) OVER ()"],ans:1,why:"GROUP BY would collapse to one row per dept and lose the individual salaries.",
 reteach:{title:"PARTITION BY = 'group by, but keep the rows'",body:"",code:"-- GROUP BY: 3 depts -> 3 rows\n-- OVER(PARTITION BY dept): 500 employees -> 500 rows,\n--   each carrying its dept's average"},
 retry:{q:"`SUM(x) OVER ()` — no PARTITION BY. What is it?",opts:["An error","The grand total, repeated on every row","The row's own value","NULL"],ans:1,why:"Empty OVER() = the whole result set is one window. Handy for % of total."}},

{id:"sq30",deck:"sql",type:"teach",title:"ROW_NUMBER vs RANK vs DENSE_RANK",body:"Scores 10, 10, 9:",code:"ROW_NUMBER  -> 1, 2, 3   (always unique)\nRANK        -> 1, 1, 3   (gap after a tie)\nDENSE_RANK  -> 1, 1, 2   (no gap)"},
{id:"sq31",deck:"sql",type:"q",q:"\"Second highest salary per department, ties count once.\" Which function?",opts:["ROW_NUMBER","RANK","DENSE_RANK","COUNT"],ans:2,why:"DENSE_RANK gives the second *distinct* salary. RANK would skip to 3 after a tie; ROW_NUMBER picks arbitrarily among ties.",
 reteach:{title:"Choose by what a tie should do",body:"• Need exactly one row per group → ROW_NUMBER\n• Need 'top 3 including ties' → RANK\n• Need 'the 2nd distinct value' → DENSE_RANK",code:"WITH r AS (\n  SELECT name, dept, salary,\n     DENSE_RANK() OVER (PARTITION BY dept\n                        ORDER BY salary DESC) AS rk\n  FROM employees)\nSELECT * FROM r WHERE rk = 2;"},
 retry:{q:"\"Exactly one most-recent order per customer.\" Which?",opts:["RANK","DENSE_RANK","ROW_NUMBER","NTILE"],ans:2,why:"Only ROW_NUMBER guarantees a single row even when two orders share a timestamp."}},

{id:"sq32",deck:"sql",type:"teach",title:"Top-N-per-group — memorise this shape",body:"Asked in almost every data screen.",code:"WITH ranked AS (\n  SELECT *,\n    ROW_NUMBER() OVER (PARTITION BY dept\n                       ORDER BY salary DESC) AS rn\n  FROM employees\n)\nSELECT * FROM ranked WHERE rn <= 3;",note:"You can't filter a window function in WHERE directly — that's why it needs the CTE."},
{id:"sq33",deck:"sql",type:"q",q:"Why can't you write `WHERE ROW_NUMBER() OVER (...) = 1`?",opts:["Syntax typo","Window functions are computed after WHERE, so you must wrap them in a CTE/subquery","They only work with GROUP BY","They need an index"],ans:1,why:"Execution order again: WHERE → … → SELECT (where windows are computed). So filter in an outer query.",
 reteach:{title:"Back to the order of execution",body:"FROM → WHERE → GROUP BY → HAVING → **window functions / SELECT** → ORDER BY → LIMIT",code:"-- wrap it:\nSELECT * FROM (\n  SELECT *, ROW_NUMBER() OVER (...) rn FROM t\n) x\nWHERE x.rn = 1;"},
 retry:{q:"Which clause can reference a window function directly?",opts:["WHERE","HAVING","ORDER BY","GROUP BY"],ans:2,why:"ORDER BY runs after SELECT."}},

{id:"sq34",deck:"sql",type:"teach",title:"LAG / LEAD — compare to previous row",body:"",code:"SELECT day, dau,\n  LAG(dau) OVER (ORDER BY day) AS prev_dau,\n  dau - LAG(dau) OVER (ORDER BY day) AS delta\nFROM daily_actives;"},
{id:"sq35",deck:"sql",type:"q",q:"Day-over-day % change in tickets. Which expression?",opts:["dau / LAG(dau) OVER ()","100.0 * (dau - LAG(dau) OVER (ORDER BY day)) / LAG(dau) OVER (ORDER BY day)","LEAD(dau) - dau","SUM(dau) OVER (ORDER BY day)"],ans:1,why:"(today − yesterday) / yesterday. The ORDER BY inside OVER is what defines 'yesterday'.",
 reteach:{title:"LAG needs an ORDER BY inside OVER",body:"Without it, 'previous row' is undefined. Also guard against divide-by-zero.",code:"NULLIF(LAG(dau) OVER (ORDER BY day), 0)"},
 retry:{q:"`LAG(x) OVER (PARTITION BY user_id ORDER BY ts)` gives you…",opts:["the previous row overall","the previous row for that same user","the next row","the first row"],ans:1,why:"PARTITION BY restarts the window per user — essential for per-user sequences."}},

{id:"sq36",deck:"sql",type:"teach",title:"Running total",body:"",code:"SELECT day, amount,\n  SUM(amount) OVER (ORDER BY day\n    ROWS BETWEEN UNBOUNDED PRECEDING\n             AND CURRENT ROW) AS running_total\nFROM revenue;"},

{id:"sq37",deck:"sql",type:"teach",title:"Dates",body:"",code:"WHERE d >= '2026-01-01' AND d < '2026-02-01'   -- safe, index-friendly\nDATE_TRUNC('month', ts)     -- bucket by month\nCURRENT_DATE - INTERVAL '7 days'"},
{id:"sq38",deck:"sql",type:"q",q:"Why is `WHERE DATE(created_at) = '2026-08-12'` a worse filter than a range?",opts:["It's wrong","Wrapping the column in a function blocks index use, forcing a full scan","DATE() doesn't exist","It ignores NULLs"],ans:1,why:"Keep the column bare on the left. Compare against a range instead.",
 reteach:{title:"Don't wrap the indexed column",body:"",code:"-- slow\nWHERE DATE(created_at) = '2026-08-12'\n-- fast\nWHERE created_at >= '2026-08-12'\n  AND created_at <  '2026-08-13'"},
 retry:{q:"'Last 7 days including today' — which is safest?",opts:["WHERE ts > CURRENT_DATE - 7","WHERE ts >= CURRENT_DATE - INTERVAL '6 days' AND ts < CURRENT_DATE + INTERVAL '1 day'","WHERE DATE(ts) IN (...)","WHERE YEAR(ts)=2026"],ans:1,why:"An explicit half-open range handles timestamps with a time component correctly."}},

{id:"sq39",deck:"sql",type:"teach",title:"Dedupe pattern",body:"Keep one row per key.",code:"WITH r AS (\n  SELECT *, ROW_NUMBER() OVER (\n     PARTITION BY email ORDER BY updated_at DESC) rn\n  FROM users)\nSELECT * FROM r WHERE rn = 1;"},

{id:"sq40",deck:"sql",type:"teach",title:"Worked problem 1",body:"\"Each user and how many books they returned late.\"",code:"SELECT u.id, u.name, COUNT(*) AS late_returns\nFROM loans l\nJOIN users u ON u.id = l.user_id\nWHERE l.return_date > l.due_date\nGROUP BY u.id, u.name\nORDER BY late_returns DESC;",note:"Then say: \"if we also want users with zero, I'd switch to a LEFT JOIN and move the date test into ON.\""},
{id:"sq41",deck:"sql",type:"q",q:"In that query, users with **zero** late returns are…",opts:["shown with 0","missing entirely, because the INNER JOIN + WHERE removes them","shown as NULL","duplicated"],ans:1,why:"Both the join and the WHERE drop them. This 'what about the zeros?' remark is exactly the follow-up they're listening for.",
 reteach:{title:"The zero-row rewrite",body:"",code:"SELECT u.id, u.name,\n  COUNT(l.id) AS late_returns\nFROM users u\nLEFT JOIN loans l\n  ON l.user_id = u.id\n AND l.return_date > l.due_date\nGROUP BY u.id, u.name;",note:"COUNT(l.id) not COUNT(*) — otherwise unmatched users count as 1."},
 retry:{q:"In that LEFT JOIN version, why `COUNT(l.id)` instead of `COUNT(*)`?",opts:["Style only","COUNT(*) counts the NULL placeholder row, so zero-loan users would show 1","It's faster","COUNT(*) errors"],ans:1,why:"COUNT(col) skips NULLs. This is a very common off-by-one in reports."}},

{id:"sq42",deck:"sql",type:"teach",title:"Worked problem 2",body:"\"Total orders and unique customers per month.\"",code:"SELECT DATE_TRUNC('month', order_date) AS mth,\n       COUNT(*)                        AS orders,\n       COUNT(DISTINCT customer_id)     AS customers,\n       SUM(total)                      AS revenue\nFROM orders\nGROUP BY 1\nORDER BY 1;"},
{id:"sq43",deck:"sql",type:"teach",title:"Worked problem 3 — support flavoured",body:"\"Resolution rate by partner, last 30 days, partners with ≥ 50 tickets.\"",code:"SELECT p.name,\n  COUNT(*) AS tickets,\n  ROUND(100.0 * SUM(CASE WHEN t.status='resolved'\n                         THEN 1 ELSE 0 END)\n        / COUNT(*), 1) AS resolve_pct\nFROM tickets t\nJOIN partners p ON p.id = t.partner_id\nWHERE t.created_at >= CURRENT_DATE - INTERVAL '30 days'\nGROUP BY p.name\nHAVING COUNT(*) >= 50\nORDER BY resolve_pct ASC;"},
{id:"sq44",deck:"sql",type:"q",q:"Why `ORDER BY resolve_pct ASC` there?",opts:["Alphabetical","Worst performers first — that's where support effort goes","Random","It's required"],ans:1,why:"Small thing, but interpreting *why* you sorted that way shows product sense. Always say what the result would tell you.",
 reteach:{title:"Always close with the 'so what'",body:"After writing a query, add one sentence: \"This tells us which partners are struggling, so I'd look at their top error codes next.\"",code:"-- natural follow-up query\nSELECT error_code, COUNT(*)\nFROM tickets WHERE partner_id = ?\nGROUP BY 1 ORDER BY 2 DESC LIMIT 5;"},
 retry:{q:"The interviewer asks 'what would you check next?' Best answer?",opts:["Nothing, the query is done","Break the worst partner down by error code and by day, to see if it's one bug or a trend","Rerun it","Add more columns"],ans:1,why:"Slice deeper on the outlier. That's the support-engineer instinct."}},

{id:"sq45",deck:"sql",type:"teach",title:"SQL final checklist",body:"Before you say 'done':\n☐ NULLs handled?\n☐ COUNT(*) vs COUNT(col)?\n☐ Any join fan-out?\n☐ Integer division?\n☐ Did I state what the result means?"}
];

/* DECK 3 — AI / ML KNOWLEDGE */
const DECK_AI = [
{id:"ai1",deck:"ai",type:"teach",title:"The 10-minute AI block",body:"Conversational. They want **awareness and curiosity**, not a PhD.",note:"The guide says it explicitly: no deep academic knowledge required. Confident plain English beats jargon."},
{id:"ai2",deck:"ai",type:"teach",title:"How to answer here",body:"One-line definition → one concrete example → one practical caveat.",note:"That three-beat rhythm makes you sound like someone who has shipped AI, not read about it."},

{id:"ai3",deck:"ai",type:"teach",title:"AI vs ML vs DL vs GenAI",body:"AI = the goal. ML = learn patterns from data. Deep learning = ML with neural nets. GenAI = models that produce new content.",note:"Nesting dolls: AI ⊃ ML ⊃ DL ⊃ GenAI/LLMs."},
{id:"ai4",deck:"ai",type:"teach",title:"The three learning types",body:"**Supervised** — labelled data (spam / not spam)\n**Unsupervised** — find structure, no labels (clustering)\n**Reinforcement** — learn from reward signals"},
{id:"ai5",deck:"ai",type:"q",q:"You group 100k support tickets into themes, with no predefined categories. That's…",opts:["Supervised","Unsupervised (clustering)","Reinforcement learning","Fine-tuning"],ans:1,why:"No labels exist — the model discovers the groupings.",
 reteach:{title:"Ask: did I give it the answers?",body:"Labels present → supervised. No labels → unsupervised. Learning from reward/feedback → RL.",code:"spam classifier      -> supervised (labelled)\nticket clustering    -> unsupervised\nRLHF on an LLM       -> reinforcement"},
 retry:{q:"Predicting whether a ticket will breach SLA, trained on 2 years of resolved tickets, is…",opts:["Unsupervised","Supervised classification","Clustering","RAG"],ans:1,why:"Historical outcomes are the labels."}},

{id:"ai6",deck:"ai",type:"teach",title:"Training vs inference",body:"**Training** = learning the weights. Slow, expensive, offline.\n**Inference** = using the model on new input. Fast, per-request, what costs you in production."},
{id:"ai7",deck:"ai",type:"teach",title:"Overfitting",body:"Model memorises training data, fails on new data.\nSymptom: great train scores, bad live performance.",note:"Fixes: more/varied data, simpler model, regularisation, proper validation."},
{id:"ai8",deck:"ai",type:"q",q:"98% accuracy in testing, 60% in production. Most likely?",opts:["Underfitting","Overfitting or train/serve data drift — the live distribution differs from training","The model is too small","Not enough GPUs"],ans:1,why:"Either it memorised, or the real world doesn't look like your training set. Both are answered by better validation and by monitoring live data.",
 reteach:{title:"Train ≠ real world",body:"Two separate failure modes worth naming:\n• **Overfitting** — memorised the training set\n• **Drift** — the world changed after you trained",code:"split: train / validation / test\n• train      -> fit\n• validation -> tune\n• test       -> touch ONCE, final estimate"},
 retry:{q:"Which most directly detects overfitting *before* you ship?",opts:["A bigger training set","A held-out validation set the model never trained on","More epochs","A faster GPU"],ans:1,why:"Held-out data is the whole point of a validation split."}},

{id:"ai9",deck:"ai",type:"teach",title:"Precision vs recall",body:"**Precision** — of the things I flagged, how many were right?\n**Recall** — of the things I should have flagged, how many did I catch?",note:"Precision = trust. Recall = coverage. You trade one for the other."},
{id:"ai10",deck:"ai",type:"q",q:"An AI auto-closes support tickets it thinks are resolved. Which matters more?",opts:["Recall — close as many as possible","Precision — a wrongly closed ticket means an abandoned customer","Neither","Accuracy only"],ans:1,why:"False positives are the expensive error here. Wrong auto-closures burn partner trust; a missed one just goes to a human.",
 reteach:{title:"Ask which mistake hurts more",body:"• False positive costly (wrongly auto-closing, wrongly blocking an account) → optimise **precision**\n• False negative costly (missing fraud, missing an outage) → optimise **recall**",code:"precision = TP / (TP + FP)\nrecall    = TP / (TP + FN)\nF1        = harmonic mean of the two"},
 retry:{q:"A model that detects service outages should favour…",opts:["Precision — avoid false alarms","Recall — a missed outage is far worse than a false alarm","Neither","Speed"],ans:1,why:"Missing a real outage is the catastrophic error; a false alarm just costs someone a look."}},
{id:"ai11",deck:"ai",type:"q",q:"1% of tickets are fraud. A model predicting 'never fraud' scores…",opts:["99% accuracy and is useless","1% accuracy","50% accuracy","It errors"],ans:0,why:"Class imbalance makes accuracy meaningless. Use precision/recall/F1, or AUC.",
 reteach:{title:"Accuracy lies on imbalanced data",body:"Always ask what the base rate is before quoting accuracy.",code:"999 not-fraud + 1 fraud\npredict all 'not fraud' -> 99.9% accurate\n                        -> recall on fraud = 0%"},
 retry:{q:"Best metric for rare-event detection?",opts:["Accuracy","Precision & recall (or F1 / PR-AUC) on the rare class","Training loss","Model size"],ans:1,why:"Measure performance on the class you actually care about."}},

{id:"ai12",deck:"ai",type:"teach",title:"What an LLM actually is",body:"A model trained to predict the next token, over enormous text. Everything else emerges from that.",note:"Say \"next-token prediction\" out loud. It's the single most load-bearing sentence in this round."},
{id:"ai13",deck:"ai",type:"teach",title:"Tokens",body:"Text is split into tokens (~¾ of a word). Models bill and limit by tokens, not characters.",code:"\"business agent\"  ->  ~3 tokens"},
{id:"ai14",deck:"ai",type:"teach",title:"Transformer & attention — one line",body:"Attention lets the model weigh which earlier tokens matter most for the next one. That's why it handles long-range context.",note:"One sentence is enough. Don't go deeper unless asked."},
{id:"ai15",deck:"ai",type:"teach",title:"How a model gets built",body:"**Pre-training** (learn language from raw text) → **fine-tuning / instruction tuning** (learn to follow instructions) → **RLHF** (align with human preferences)"},
{id:"ai16",deck:"ai",type:"q",q:"Which stage teaches a model to be helpful and refuse harmful requests?",opts:["Pre-training","Tokenisation","RLHF / preference alignment","Embedding"],ans:2,why:"Pre-training gives raw capability. Alignment shapes behaviour.",
 reteach:{title:"Capability vs behaviour",body:"Pre-training = *what it can do*.\nFine-tuning + RLHF = *how it chooses to respond*.",code:"raw text        -> pre-training\ninstruction data-> fine-tuning\nhuman rankings  -> RLHF"},
 retry:{q:"Pre-training mainly gives the model…",opts:["Its personality","Broad language and world knowledge","Its safety rules","Its context window"],ans:1,why:"Knowledge and language ability; behaviour comes later."}},

{id:"ai17",deck:"ai",type:"teach",title:"Context window",body:"How much text the model can 'see' at once — prompt + history + retrieved docs + its reply.",note:"Practical consequence: long chat histories get truncated or summarised, and quality drops. Great thing to mention about business agents."},
{id:"ai18",deck:"ai",type:"teach",title:"Temperature",body:"Low (0–0.3) = deterministic, consistent. High = creative, varied.",note:"For a customer-support agent you want it low. Say that — it shows product judgement."},
{id:"ai19",deck:"ai",type:"teach",title:"Prompting levers",body:"**System prompt** — role and rules\n**Few-shot** — show 2-3 examples\n**Structure** — ask for JSON/fixed format so downstream code can parse it"},

{id:"ai20",deck:"ai",type:"teach",title:"Hallucination",body:"The model produces something fluent and false. It's predicting plausible text, not looking anything up.",note:"For a business agent, the real risk isn't nonsense — it's a confident wrong price, policy or delivery date."},
{id:"ai21",deck:"ai",type:"q",q:"A business agent invents a refund policy the merchant never had. Best mitigation?",opts:["Raise temperature","Ground it in the merchant's real docs via retrieval, constrain the system prompt, and hand off to a human when unsure","Make the model bigger","Ask customers to rephrase"],ans:1,why:"Grounding + scope limits + escalation. That trio is the answer to most 'AI in production' questions.",
 reteach:{title:"The three-layer answer",body:"1. **Ground** — retrieve the real policy text (RAG)\n2. **Constrain** — system prompt says answer only from provided sources\n3. **Escape hatch** — low confidence or off-topic → human handoff",code:"Also: log every answer, sample-review them,\nand track a 'wrong answer' rate as a real metric."},
 retry:{q:"Why does lowering temperature alone NOT fix hallucination?",opts:["It does fix it","It only makes the output more consistent — a confidently wrong answer just becomes consistently wrong","Temperature isn't real","It increases cost"],ans:1,why:"Consistency isn't correctness. You need grounding."}},

{id:"ai22",deck:"ai",type:"teach",title:"RAG — retrieval augmented generation",body:"Fetch relevant documents first, then paste them into the prompt so the model answers from real sources.",code:"question -> search knowledge base\n         -> top-k passages\n         -> LLM answers using ONLY those",note:"This is how a business agent knows *your* catalogue and *your* hours."},
{id:"ai23",deck:"ai",type:"q",q:"A merchant updates their return policy today. With RAG, when does the agent start giving the new answer?",opts:["Only after the model is retrained","As soon as the document is re-indexed — no retraining needed","Never","After fine-tuning"],ans:1,why:"That freshness property is the main reason RAG beats fine-tuning for business facts.",
 reteach:{title:"RAG vs fine-tuning",body:"**RAG** → facts that change (prices, stock, policies, hours)\n**Fine-tuning** → style, tone, format, domain vocabulary\n**Prompting** → try this first, it's free",code:"Rule of thumb:\n  new knowledge  -> RAG\n  new behaviour  -> fine-tune\n  quick fix      -> better prompt"},
 retry:{q:"A merchant wants the agent to always reply in their brand's chatty voice. Best tool?",opts:["RAG","System prompt / few-shot examples, or fine-tuning if it must be consistent at scale","A bigger context window","Lower temperature"],ans:1,why:"Tone is behaviour, not knowledge."}},
{id:"ai24",deck:"ai",type:"teach",title:"Embeddings",body:"Text → a vector of numbers, where similar meanings sit close together. That's how retrieval finds relevant docs without exact keyword matches.",note:"\"Where's my order?\" and \"delivery status?\" land near each other."},
{id:"ai25",deck:"ai",type:"q",q:"Semantic search returns junk for one merchant's queries. Most likely cause?",opts:["The LLM is broken","Retrieval quality — poor chunking, missing content in the index, or bad embeddings for that domain's jargon","Temperature","Not enough tokens"],ans:1,why:"In most RAG failures the generator is fine; the retriever handed it the wrong context. Debug retrieval first.",
 reteach:{title:"Debug RAG in two halves",body:"1. Did retrieval return the right passages? (inspect them!)\n2. Given those passages, did the model answer correctly?\n\nAlmost always it's #1.",code:"Common retrieval bugs:\n• chunks too big / too small\n• doc never indexed\n• stale index\n• domain jargon not in embedding space"},
 retry:{q:"Retrieval returns the correct policy doc, but the answer is still wrong. Now what?",opts:["Reindex","Look at the prompt: is it told to answer only from sources? Is the passage getting truncated by the context limit?","Change the database","Retrain embeddings"],ans:1,why:"If context is right but output is wrong, the issue is prompt or context-window truncation."}},

{id:"ai26",deck:"ai",type:"teach",title:"AI agents & tool calling",body:"An agent is an LLM that can call functions — check stock, book a slot, create a ticket — and use the result.",note:"This is literally the Meta Business Agent shape. Know it cold."},
{id:"ai27",deck:"ai",type:"q",q:"The riskiest part of letting an agent take actions?",opts:["Latency","It can act wrongly on real systems — so you need scoped permissions, confirmation for irreversible actions, and audit logs","Token cost","Model size"],ans:1,why:"Reading is safe; writing is not. Refunds, cancellations and messages to customers need guardrails.",
 reteach:{title:"Guardrails for agentic actions",body:"• Least-privilege tool scopes\n• Human confirmation for irreversible/high-value actions\n• Idempotency keys so a retry doesn't double-refund\n• Full audit log of every tool call",code:"read stock      -> auto\nissue refund    -> confirm / cap the amount"},
 retry:{q:"An agent retries a failed refund call and the customer gets paid twice. Fix?",opts:["Stop retrying","Idempotency key on the request so duplicates are ignored server-side","Lower temperature","Use a bigger model"],ans:1,why:"Classic distributed-systems answer — and exactly the kind of thing this role deals with."}},

{id:"ai28",deck:"ai",type:"teach",title:"Evals — how you know it works",body:"A fixed test set of real questions + expected answers, scored on every change. Plus live sampling and human review.",note:"Saying \"I'd build an eval set before shipping\" is a strong, senior-sounding line."},
{id:"ai29",deck:"ai",type:"q",q:"A prompt change makes 5 sample answers better. Ship it?",opts:["Yes","No — 5 anecdotes aren't evidence. Run it against the eval set to check for regressions elsewhere","Only on weekends","Ask the model"],ans:1,why:"Prompt changes routinely fix one case and break three others. Regression testing applies to AI too.",
 reteach:{title:"Treat prompts like code",body:"Version them, test them, roll them out gradually, watch the metrics, keep a rollback path.",code:"eval set -> A/B or canary -> monitor\nmetrics: containment rate, escalation rate,\n         CSAT, wrong-answer rate, latency, cost"},
 retry:{q:"Best single production metric for a customer-support agent?",opts:["Tokens used","Containment/resolution rate paired with CSAT — did it actually solve it, and were people happy","Model parameters","Response length"],ans:1,why:"Resolution alone can be gamed by refusing to escalate; pair it with satisfaction."}},

{id:"ai30",deck:"ai",type:"teach",title:"The practical constraints",body:"**Latency** — customers wait; streaming and smaller models help\n**Cost** — per token, at scale\n**Privacy** — PII in prompts and logs\n**Drift** — quality decays as the world changes"},
{id:"ai31",deck:"ai",type:"teach",title:"Bias & safety",body:"Models inherit biases from training data. In a business context: uneven quality across languages/regions, and unsafe or off-brand replies.",note:"Mitigations: diverse eval sets sliced by language and region, output filters, human review."},
{id:"ai32",deck:"ai",type:"q",q:"An agent works well in English but poorly in Portuguese. First step?",opts:["Retrain from scratch","Slice your evals by language to quantify the gap, then check whether the knowledge base is even translated","Turn it off","Raise temperature"],ans:1,why:"Measure the gap before fixing it — and very often the real cause is that the retrieved content is English-only.",
 reteach:{title:"Always slice your metrics",body:"An aggregate number hides the failure. Break down by language, region, merchant size, and query type.",code:"overall CSAT 4.4  -> looks fine\n  EN 4.6  PT 3.1   -> the real story"},
 retry:{q:"Aggregate resolution rate is flat, but complaints spiked. Likely?",opts:["Nothing is wrong","A specific segment regressed while the average masks it — slice the data","The metric is broken","Random noise"],ans:1,why:"Averages hide segment regressions. Slice first."}},

{id:"ai33",deck:"ai",type:"teach",title:"Your 60-second script",body:"If asked \"what are the challenges of AI-powered products?\" say:\n**Accuracy** (hallucination → grounding) · **Trust** (handoff + transparency) · **Measurement** (evals, not vibes) · **Ops** (latency, cost, drift, privacy)",note:"Four buckets, one example each. Then stop talking."},
{id:"ai34",deck:"ai",type:"teach",title:"If you don't know",body:"\"I'm not sure — but if I had to reason about it, I'd say…\"\nThe guide recommends this exact move. Never bluff a definition."}
];

/* DECK 4 — META BUSINESS AGENTS & API TROUBLESHOOTING */
const DECK_META = [
{id:"mt1",deck:"meta",type:"teach",title:"Why this deck matters",body:"The JD asks for distributed systems + API troubleshooting. Nothing signals fit faster than talking fluently about the product you'd support.",note:"None of this is quizzed formally — it comes out in \"why this role\" and in your questions at the end."},

{id:"mt2",deck:"meta",type:"teach",title:"Meta Business Agent — what it is",body:"An AI assistant a business turns on to handle customer conversations 24/7, without writing code.",note:"Launched 2026. Meta reports 1M+ businesses using it on WhatsApp and Messenger."},
{id:"mt3",deck:"meta",type:"teach",title:"Where it runs",body:"**WhatsApp · Messenger · Instagram** — Meta's business messaging surfaces.",note:"Announced at Conversations, Meta's business-messaging conference."},
{id:"mt4",deck:"meta",type:"teach",title:"What it does",body:"Answers FAQs · recommends products from the catalogue · qualifies leads · books appointments · replies in the customer's language",note:"It grounds on the business profile, product catalogue and past conversations — i.e. RAG over merchant data."},
{id:"mt5",deck:"meta",type:"teach",title:"Human handoff",body:"When it can't handle something, it flags the conversation and passes it — with full history — to a human. The **business** sets when that happens, not the agent.",note:"That design choice is worth quoting. It shows you read carefully."},
{id:"mt6",deck:"meta",type:"teach",title:"The Platform tier",body:"For larger businesses: connects to hundreds of systems (Shopify, Zendesk, …), with enterprise controls, guardrails and measurement.",note:"That's where a Business Support Engineer lives — partners, integrations, and things going wrong across systems."},
{id:"mt7",deck:"meta",type:"q",q:"Self-serve Business Agent vs the WhatsApp Business Platform (Cloud API) — the key difference?",opts:["Same product, different name","Self-serve runs in the Business app for small merchants; the Cloud API is the developer platform for scale — webhooks, multi-agent inboxes, CRM integrations, campaigns","The API is free, the agent is paid","The agent is API-only"],ans:1,why:"They're built for different scales. Knowing this distinction is genuinely rare among candidates.",
 reteach:{title:"Two doors into the same messaging",body:"**Business Agent (self-serve)** — no code, one operator, no API/webhooks\n**WhatsApp Business Platform / Cloud API** — programmatic, webhooks, BSPs, team routing, templates at scale",code:"A partner integration issue = Cloud API world.\nThat's the troubleshooting your role handles."},
 retry:{q:"A partner asks why they can't route conversations to a 10-person team on the free agent. Answer?",opts:["It's a bug","The self-serve tier has no multi-agent inbox or routing — that needs the Business Platform / API","Restart the app","Buy more tokens"],ans:1,why:"Knowing product boundaries prevents you from debugging a limitation as if it were a fault."}},

{id:"mt8",deck:"meta",type:"teach",title:"What the role actually does",body:"Partners integrate against Meta's messaging APIs. Things break. You reproduce, diagnose across systems, fix or escalate, and feed patterns back into the product roadmap.",note:"\"Improving the end-to-end support experience\" = you're expected to fix causes, not just tickets."},

{id:"mt9",deck:"meta",type:"teach",title:"How Cloud API messaging works",body:"Outbound: your server POSTs to Meta's Graph API.\nInbound: Meta POSTs a **webhook** to your public HTTPS endpoint.",note:"Two directions, two failure surfaces. Always ask which one is broken."},
{id:"mt10",deck:"meta",type:"teach",title:"The 24-hour customer service window",body:"After a customer messages you, you have 24h of free-form replies. After that, only **approved templates**.",note:"This single rule causes an enormous share of real support tickets."},
{id:"mt11",deck:"meta",type:"q",q:"Partner reports error **131047** on a batch of messages. Cause and fix?",opts:["Rate limit — slow down","The 24-hour window has passed since the customer last replied — use an approved template message to re-engage","Invalid token — refresh it","Bad phone number"],ans:1,why:"131047 = more than 24 hours since the recipient last replied. Free-form is blocked; templates are the way back in.",
